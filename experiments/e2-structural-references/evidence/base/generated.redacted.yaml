version: v1alpha1
debug: false
persist: true
machine:
    type: controlplane
    token: <redacted>
    ca:
        crt: <redacted>
        key: <redacted>
    certSANs: []
    kubelet:
        image: ghcr.io/siderolabs/kubelet:v1.36.2
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
    install:
        disk: /dev/sda
        image: ghcr.io/siderolabs/installer:v1.13.6
        wipe: false
        grubUseUKICmdline: true
    features:
        diskQuotaSupport: true
        kubePrism:
            enabled: true
            port: 7445
        hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
    nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
cluster:
    id: <redacted>
    secret: <redacted>
    controlPlane:
        endpoint: https://10.55.0.2:6443
    clusterName: e2-structural
    network:
        dnsDomain: cluster.local
        podSubnets:
            - 10.244.0.0/16
        serviceSubnets:
            - 10.96.0.0/12
    token: <redacted>
    secretboxEncryptionSecret: <redacted>
    ca:
        crt: <redacted>
        key: <redacted>
    aggregatorCA:
        crt: <redacted>
        key: <redacted>
    serviceAccount:
        key: <redacted>
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.36.2
        admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.36.2
    proxy:
        image: registry.k8s.io/kube-proxy:v1.36.2
    scheduler:
        image: registry.k8s.io/kube-scheduler:v1.36.2
    discovery:
        enabled: true
        registries:
            kubernetes:
                disabled: true
            service: {}
    etcd:
        ca:
            crt: <redacted>
            key: <redacted>
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: stable
