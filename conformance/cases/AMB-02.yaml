id: AMB-02
setup: as ETAG-01, without the other author
action: Save the edited fragment entry
exchange:
  - request: PUT /api/v1/drafts/<draft>/fragments/<name>
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>", "If-Match: <etag>"]
  - request: GET /api/v1/recovery
    headers: ["Authorization: Bearer <token>", "Accept: application/json"]
fault: the injector forwards the write and closes the page's connection at once while the server runs on; the provider proxy holds each KV write 6 s, so the first request's ingestion holds its claim
expect:
  server: the first request ingests and commits once; each repeat before it ends is answered 409 conflict with ingestion and no draft
  client: the write repeated with the same key and request; each in-progress 409 repeated with backoff (1, 1, 2, 4 s), not counted as one of the 3 repeats, up to the wait bound (the larger of 2 minutes and the claim lease); then the replay
  shown: while waiting, the save line names the ingestion; then the replayed result, marked as such
  absent: [token or document in the harness log, retained artifacts or browser storage]
runs:
  web:
    check: web/e2e/auth/drafts.e2e.ts, mise run browser-auth; the bound, a published draft's 409 and a sign-in change while waiting in web/src/write.test.ts, mise run web
    browsers: [chrome, edge, firefox, firefox-esr]
