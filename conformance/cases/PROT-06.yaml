id: PROT-06
setup: as PROT-01, with the serving process able to be killed and started again on the same database; the lease is 15 s
action: (1) send a mark; (2) continue the import; (3) take the import over; in each, the harness holds the provider's decrypt route so the run writes no event, kills the serving process, releases the hold and starts the process again; (4) continue the import with the run's draft commit stalled, wait for the lease to lapse, then let the commit go
exchange:
  - request: POST /api/v1/ingestions/<ingestion>/marks
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>"]
  - request: POST /api/v1/ingestions/<ingestion>/continuations
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>"]
  - request: POST /api/v1/ingestions/<ingestion>/takeovers
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>"]
fault: in cases 1 to 3, the serving process killed with SIGKILL after the 202 and before the run's first event; in case 4, the run released its claim and its draft transaction stalls before the commit (the interrupt build of the fixture, step draft-commit, action stall), so its heartbeat finds the claim's lock held and the lease lapses
expect:
  server: the lease lapses; the operation stays running until a takeover or an abandon; in case 4 it runs on, and once the commit goes the claim is released and the operation succeeds
  client: the watch ends once the lease passed, with the operation still running; in case 4 the read of the operation answers at once while the commit stalls, because the read of an operation locks its row only when it shows attempts (ginsys/bronzeward#803), so it is never held to the client's 30 s bound on response headers (AMB-14)
  shown: the outcome is unknown and never not applied; takeover and abandon offered; no wait until the claim's absolute expiry; in case 4 the CLI exits 3 with "its claim is held and its lease lapsed" and the web shows the same reading, and both show the import released once the commit went
  absent: [synthetic value or token in the harness log, retained artifacts or browser storage]
runs:
  web:
    check: web/e2e/auth/protected.e2e.ts, mise run browser-auth with BW_SPECS=protected
    browsers: [chrome, edge, firefox, firefox-esr]
    covers: 'cases 1 to 4. In case 4 the "held, outcome unknown" reading comes from the ingestion read (GET /api/v1/ingestions/<ingestion>), the claim held with its lease lapsed. An abandoned read is unreachable on a continuation: an encrypted claim is not due until its expiresAt, however long its lease has lapsed (internal/staging/sweep.go:13). The same case runs in the CLI: internal/clitest/import_test.go (the subtest "PROT-06, the draft commit delayed"), recorded in internal/clitest/testdata/import-cases.yaml'
