id: EVT-01
setup: the disposable deployment on a recovery start, seeded with an operation that has no attempt, its recovery entry made as h-recovery (the operation is unresolved, with its events); signed in as h-viewer through the injector, which passes the event stream on
action: open the operation page and let its event stream deliver the operation's events
exchange:
  - request: GET /operations/{id}/events
    headers: ["Accept: text/event-stream"]
  - request: GET /operations/{id}/events
    headers: ["Accept: text/event-stream", "Last-Event-ID: the ID of the last event shown"]
fault: the injector closes the stream's connection after it passed every event, so the page's read ends with no terminal state
expect:
  server: the second stream opened with the ID of the last event shown
  client: the stream reopened once, from the last event shown; the operation read between the two
  shown: 'every event once, as a received row, with the page saying it is live; after a resolution to cancelled, one more row for the change of state and the outcome "Cancelled: resolution", and the stream not opened a third time'
  absent: [an event shown twice or missing after the reconnect, token in browser storage]
runs:
  web:
    check: web/e2e/auth/operation.e2e.ts, mise run browser-auth with BW_SPECS=operation
    browsers: [chrome, edge, firefox, firefox-esr, safari]
    covers: the reconnect after events that were delivered. The injector closes the connection 400 ms after the last event it passed, because a browser drops the data it has not read when its body stream fails, so the case does not prove a cut that loses events in flight; the Go and CLI tests cover that cut (internal/client/watch_test.go, internal/clitest/operations_test.go)
