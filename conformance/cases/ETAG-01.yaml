id: ETAG-01
setup: a disposable deployment with mise run dev-bao's OpenBao as its provider; a draft with one fragment entry, written through the API as h-author; the fixture page signed in as h-author, the draft's page read (its ETag kept) and the entry edited
action: another author (h-all) writes a second fragment entry to the draft through the API; then Save the edited entry
exchange:
  - request: PUT /api/v1/drafts/<draft>/fragments/<name>
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>", "If-Match: <the ETag the page read>"]
fault: none; the other author's write moves the draft past the page's ETag
expect:
  server: 412 precondition-failed, nothing written
  client: the write not resent; one read of the draft for the revision shown, its ETag not kept
  shown: the conflict view with the draft's new revision; Show their change reads the draft again and shows the other entry; Copy my text into the new revision puts the operator's text back, and Save then writes it under the new ETag
  absent: [token or document in the harness log, retained artifacts or browser storage]
runs:
  web:
    check: web/e2e/auth/drafts.e2e.ts, mise run browser-auth
    browsers: [chrome, edge, firefox, firefox-esr]
