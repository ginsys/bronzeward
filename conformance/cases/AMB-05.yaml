id: AMB-05
setup: as AMB-01
action: send Add cluster
exchange:
  - request: POST /api/v1/clusters
    headers: ["Authorization: Bearer <token>", "Content-Type: application/json", "Idempotency-Key: <key>", "Bronzeward-Expected-Epoch: <epoch>"]
  - request: GET /api/v1/recovery
    headers: ["Authorization: Bearer <token>", "Accept: application/json"]
fault: the injector forwards the write, closes the connection without its answer, then commits a new epoch in the deployment's database, as a recovery entry does
expect:
  server: the write received once
  client: before the repeat, one read of GET /recovery shows another epoch, so the write is set aside and not repeated
  shown: the set-aside notice with the key, the route and the resource to read; Repeat exactly disabled; Show current state opens the clusters list, which shows the cluster, and the operator decides
  absent: [token in the harness log, retained artifacts or browser storage]
runs:
  web:
    check: web/e2e/auth/writes.e2e.ts, mise run browser-auth
    browsers: [chrome, edge, firefox, firefox-esr]
