id: AUTH-03
setup: as AUTH-02; signed in as h-viewer with a valid token minted -without-group bw-viewers
action: load the web client, sign in, read GET /server
exchange:
  - request: GET /api/v1/server
    headers: ["Authorization: Bearer <token>", "Accept: application/json"]
fault: none
expect:
  server: 403 forbidden with the route's roles
  shown: "Needs viewer or author or publisher or approver or recovery-admin; you are signed in as h-viewer"
  absent: [token in the harness log, retained artifacts or browser storage]
runs:
  web:
    check: web/e2e/auth/fixture.e2e.ts, mise run browser-auth
    browsers: [chrome, edge, firefox, firefox-esr]
