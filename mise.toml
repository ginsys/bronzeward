[tools]
# ci.yml installs from this list (jdx/mise-action); a bump here is the only edit needed. A new
# tool also needs naming in the `install_args` of every job that runs a task using it, since each
# job installs only what it names.
actionlint = "1.7.12"
shellcheck = "0.11.0"
go = "1.27.1"
# The current LTS; web/package.json's engines names the same version. safari.yml's safari job reads
# this line, in this form, for actions/setup-node (ginsys/bronzeward#415).
node = "24.22.1"
# mise run package: the release archives (.goreleaser.yaml).
goreleaser = "2.19.0"

[tasks.lint]
description = "actionlint on the workflows, shellcheck on the scripts"
# SHELLCHECK_OPTS is cleared so a shell default such as --exclude=SC2086 cannot hide locally a
# finding CI reports with a clean environment.
run = """
env -u SHELLCHECK_OPTS actionlint
env -u SHELLCHECK_OPTS shellcheck scripts/ci/*.sh scripts/dev/*.sh scripts/release/*.sh scripts/test/*.sh
env -u SHELLCHECK_OPTS shellcheck -x fixtures/lib.sh fixtures/dev-idp fixtures/bin/* fixtures/scenarios/* experiments/e1-secret-ingress/run/* \
  experiments/e5-provider-capabilities/run/* experiments/e5-retention-classification/run/* \
  experiments/e4-dispatch-safety/run/* \
  experiments/e5-key-loss-restoration/run/* \
  experiments/e2-structural-references/run/* \
  experiments/e3-talos-compatibility/run/* \
  experiments/e4-database-semantics/run/* \
  experiments/e2-sensitivity-provenance/run/* \
  experiments/scanner-cross-line/run/*
"""

[tasks.test]
description = "Fixture tests for scripts/ci/commit-lint.sh, scripts/ci/needs-check.sh, scripts/ci/report-safari.sh, scripts/ci/browser-tmp.sh, scripts/dev/instance.sh, fixtures/dev-idp's web-origin check, the participant session and its t5 leak scan, scenarios/s5 cli's unseen-overwrite and unfreeze-refusal checks, and scripts/release/compare-sums.sh, render-caddy.py, guard.sh and fixtures/lib.sh's isolated_run"
run = ["bash scripts/test/commit-lint-test.sh", "bash scripts/test/needs-check-test.sh", "bash scripts/test/report-safari-test.sh", "bash scripts/test/browser-tmp-test.sh", "bash scripts/test/dev-instance-test.sh", "bash scripts/test/dev-idp-origin-test.sh", "bash scripts/test/participant-session-test.sh", "bash scripts/test/scenario-ctl-env-test.sh", "bash scripts/test/s5-cli-test.sh", "node --test scripts/test/collide-scan-test.mjs", "bash scripts/test/compare-sums-test.sh", "python3 scripts/test/render-caddy-test.py", "bash scripts/test/release-guard-test.sh", "bash scripts/test/isolated-run-test.sh"]

[tasks.package]
description = "Build the release archives at BW_VERSION into dist/ (ginsys/bronzeward#262 P3, P6): the web tarball and notices, then GoReleaser in snapshot mode; publishes nothing"
run = """
: "${BW_VERSION:?set BW_VERSION, e.g. v0.0.0-dev}"
bash scripts/release/web-package.sh
goreleaser release --snapshot --clean
cp build/bronzeward-web_*.tar.gz dist/
"""

[tasks."package:check"]
description = "Check dist/ from mise run package at HEAD: versions, revisions, targets, contents (scripts/release/check-build.sh), and that planted defects fail it (scripts/test/check-build-test.sh)"
run = [
  'EXPECT_REVISION=$(git rev-parse HEAD) bash scripts/release/check-build.sh dist',
  'EXPECT_REVISION=$(git rev-parse HEAD) bash scripts/test/check-build-test.sh dist',
]

[tasks.hosting]
description = "Serve dist/'s web tarball through its rendered Caddyfile in the pinned Caddy image and compare the served headers and routes (needs Docker)"
run = "python3 scripts/test/hosting-test.py dist"

[tasks.docs]
description = "Documentation checks and the planted-sentinel test of their example scan (needs Python 3.9+ with PyYAML 6)"
run = ["python3 scripts/verify-docs.py", "python3 scripts/test/verify-docs-scan-test.py"]

[tasks."site:install"]
description = "Install requirements-site.txt into .venv-site (gitignored; needs Python 3.10+)"
run = """
[ -x .venv-site/bin/python ] || python3 -m venv .venv-site
.venv-site/bin/pip install --quiet --disable-pip-version-check -r requirements-site.txt
"""

[tasks.site]
description = "Run the link-rewrite tests, then build the documentation site into site/ with --strict, as ci.yml's site job does"
depends = ["site:install"]
# NO_MKDOCS_2_WARNING: mkdocs-material's MkDocs 2.0 banner, printed on every run (see
# requirements-site.txt for why the site stays on 1.x).
env = { NO_MKDOCS_2_WARNING = "true" }
run = """
.venv-site/bin/python scripts/test/site-hooks-test.py
.venv-site/bin/mkdocs build --strict
"""

[tasks."site:serve"]
description = "Serve the documentation site at http://127.0.0.1:8000 with live reload"
depends = ["site:install"]
env = { NO_MKDOCS_2_WARNING = "true" }
run = ".venv-site/bin/mkdocs serve --strict"

[tasks.whitespace]
description = "git diff --check over the whole tree at HEAD and over the working tree, as ci.yml's docs job does"
run = """
git diff --check "$(git hash-object -t tree /dev/null)" HEAD
git diff --check
"""

[tasks.commit-lint]
description = "Conventional-commit subjects on this branch's commits since origin/main (fetch it first)"
run = """
base=$(git merge-base origin/main HEAD) || { echo "commit-lint: no merge-base with origin/main; fetch it first" >&2; exit 1; }
scripts/ci/commit-lint.sh "$base" HEAD
"""

[vars]
# The pinned generator of internal/client/apitypes (decision T1 of ginsys/bronzeward#254). `go run`
# at a version keeps it, and its own dependencies, out of go.mod.
oapi_codegen = "go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.1 -config internal/client/apitypes/oapi-codegen.yaml"

[tasks.generate]
description = "Regenerate internal/client/apitypes/apitypes.gen.go from api/openapi.yaml with the pinned oapi-codegen"
run = "{{vars.oapi_codegen}} -o internal/client/apitypes/apitypes.gen.go api/openapi.yaml"

[tasks."generate:check"]
description = "Fail when internal/client/apitypes/apitypes.gen.go differs from what mise run generate writes"
run = """
out=$(mktemp)
trap 'rm -f "$out"' EXIT
{{vars.oapi_codegen}} -o "$out" api/openapi.yaml
diff -u internal/client/apitypes/apitypes.gen.go "$out" || {
  echo "generate:check: internal/client/apitypes/apitypes.gen.go is stale; run mise run generate" >&2
  exit 1
}
"""

[tasks.go]
description = "Check the generated API types, then build, vet, format-check and test the root module and the Phase-0 experiment modules"
# generate:check runs first, so CI's go job, which runs this task, fails on a stale generated file.
depends = ["generate:check"]
# The root module (cmd/, internal/, fixtures/oidc) comes first. Its go.mod ignores ./site and ./web,
# which the site and web tasks rebuild in parallel under `mise run verify`, and carries `ignore ./experiments`, so
# the root `./...` never sweeps disposable evidence code into the implementation: the nested
# go.mod files alone do not suffice, since experiments/e3-talos-compatibility/machinery/src has
# none. Each experiment is its own module, checked with `go -C <dir>`, one line per module.
# `mod tidy -diff` fails instead of rewriting, so CI reports a stale go.mod rather than hiding it.
run = """
gofmt -l cmd internal fixtures/oidc fixtures/webhost | { ! grep . ; }
go mod verify
go mod tidy -diff
go build -o /dev/null ./...
go vet ./...
# The client for macOS: its Keychain store is darwin-only code, which the host's build never
# compiles (ginsys/bronzeward#628). No cgo, as the release builds. vet also type-checks its tests.
GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/bronzewardctl
GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./internal/client ./cmd/bronzewardctl
go test ./...
# The client's dependency-closure test reads the closure through a child go list, which go test's
# cache does not track, so a cached pass could hide a new forbidden import: it runs uncached.
go test -count=1 -run '^Test(ClientClosure|Forbidden)' ./internal/client
# The fixture's instance C binary: the interruption seam (internal/seam) and its callers, built with
# its tag; the tests of every other package also pass with the seam compiled in but not armed.
go vet -tags fixtureinterrupt ./...
go test -tags fixtureinterrupt ./internal/seam ./internal/ingest ./internal/api
gofmt -l experiments/e1-secret-ingress | { ! grep . ; }
go -C experiments/e1-secret-ingress mod verify
go -C experiments/e1-secret-ingress mod tidy -diff
go -C experiments/e1-secret-ingress build ./...
go -C experiments/e1-secret-ingress vet ./...
go -C experiments/e1-secret-ingress test ./...
gofmt -l experiments/e4-dispatch-safety | { ! grep . ; }
go -C experiments/e4-dispatch-safety mod verify
go -C experiments/e4-dispatch-safety mod tidy -diff
go -C experiments/e4-dispatch-safety build -o /dev/null ./...
go -C experiments/e4-dispatch-safety vet ./...
go -C experiments/e4-dispatch-safety test ./...
gofmt -l experiments/e2-structural-references | { ! grep . ; }
go -C experiments/e2-structural-references mod verify
go -C experiments/e2-structural-references mod tidy -diff
go -C experiments/e2-structural-references build -o /dev/null ./...
go -C experiments/e2-structural-references vet ./...
go -C experiments/e2-structural-references test ./...
gofmt -l experiments/e3-talos-compatibility/machinery/src | { ! grep . ; }
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 test ./...
gofmt -l experiments/e4-database-semantics | { ! grep . ; }
go -C experiments/e4-database-semantics mod verify
go -C experiments/e4-database-semantics mod tidy -diff
go -C experiments/e4-database-semantics build -o /dev/null ./...
go -C experiments/e4-database-semantics vet ./...
go -C experiments/e4-database-semantics test ./...
gofmt -l experiments/e2-sensitivity-provenance | { ! grep . ; }
go -C experiments/e2-sensitivity-provenance mod verify
go -C experiments/e2-sensitivity-provenance mod tidy -diff
go -C experiments/e2-sensitivity-provenance build -o /dev/null ./...
go -C experiments/e2-sensitivity-provenance vet ./...
go -C experiments/e2-sensitivity-provenance test ./...
gofmt -l experiments/scanner-cross-line | { ! grep . ; }
go -C experiments/scanner-cross-line mod verify
go -C experiments/scanner-cross-line mod tidy -diff
go -C experiments/scanner-cross-line build -o /dev/null ./...
go -C experiments/scanner-cross-line vet ./...
go -C experiments/scanner-cross-line test ./...
go -C experiments/scanner-cross-line/serverprobe mod verify
go -C experiments/scanner-cross-line/serverprobe mod tidy -diff
go -C experiments/scanner-cross-line/serverprobe build -o /dev/null ./...
go -C experiments/scanner-cross-line/serverprobe vet ./...
go -C experiments/scanner-cross-line/serverprobe test ./...
"""

[tasks.go-db]
description = "Test the root module against PostgreSQL and OpenBao (default: mise run dev-db's and dev-bao's, those of BW_DEV_INSTANCE when set); a missing service fails instead of skipping"
# CI's go-db job points BW_TEST_PG_DSN and BW_TEST_BAO_* at its service containers. Locally they
# default to mise run dev-db and mise run dev-bao, the instance BW_DEV_INSTANCE names
# (scripts/dev/instance.sh); any PostgreSQL 17 role that may create databases, and any OpenBao root
# token on a disposable server, also work.
# -timeout 25m, not go test's 10 min per package: internal/api takes about 325 s in CI and 476 s
# was seen on a slow runner, where a runner twice as slow again needs about 16 min. The CI job's
# timeout-minutes (ci.yml) stays above it.
run = '''
. scripts/dev/instance.sh || exit 1
: "${BW_TEST_PG_DSN:=$BW_DEV_PG_DSN}"
: "${BW_TEST_BAO_ADDR:=$BW_DEV_BAO_ADDR}"
: "${BW_TEST_BAO_TOKEN:=bw-dev-root-token}"
export BW_TEST_PG_DSN BW_TEST_BAO_ADDR BW_TEST_BAO_TOKEN
BW_REQUIRE_PG=1 BW_REQUIRE_BAO=1 go test -count=1 -timeout 25m ./...
'''

[tasks.dev-db]
description = "Start a disposable development PostgreSQL at the fixture's image pin: 127.0.0.1:11432, user bronzeward, no password; BW_DEV_INSTANCE=<name> starts bw-dev-pg-<name> on 127.0.0.1:12000+slot instead"
# Trust auth, bound to loopback, removed on stop (mise run dev-down). examples/bronzeward.yaml
# and mise run go-db default to it. Never a deployment database. The container's name and port come
# from scripts/dev/instance.sh: the default instance, or the one BW_DEV_INSTANCE names.
run = '''
. scripts/dev/instance.sh || exit 1
c=$BW_DEV_PG_CONTAINER
image=$(sed -n 's/^POSTGRES_IMAGE=//p' fixtures/versions.env)
# Every path waits for readiness: an existing container may still be initialising, and one just
# stopped may still be being removed (--rm), so it is started only once it is gone.
# -h 127.0.0.1: the entrypoint's init server listens on the socket only, so TCP readiness means
# the real server is up. (No docker --format templates: mise renders run scripts with Tera.)
# max_locks_per_transaction: each DB test migrates a fresh database in one transaction, and go
# test runs one per CPU in parallel; the default 64 runs the shared lock table out (SQLSTATE 53200).
for _ in $(seq 30); do
  if [ -z "$(docker ps -aq --filter "name=^$c\$")" ]; then
    # Any failure is shown and retried (a name taken by a concurrent start is not one), except a
    # taken port: waiting does not free it, so the container docker left behind is removed.
    out=$(docker run -d --rm --name "$c" -e POSTGRES_USER=bronzeward -e POSTGRES_HOST_AUTH_METHOD=trust \
      -p "127.0.0.1:$BW_DEV_PG_PORT:5432" "$image" -c max_locks_per_transaction=256 2>&1) || {
      echo "$out" >&2
      case $out in
      *"port is already allocated"* | *"address already in use"*)
        docker rm -f "$c" >/dev/null 2>&1 || true
        echo "dev-db: 127.0.0.1:$BW_DEV_PG_PORT is taken${BW_DEV_INSTANCE:+ (BW_DEV_INSTANCE=$BW_DEV_INSTANCE may share its slot with another instance: use another name)}" >&2
        exit 1
        ;;
      esac
    }
  elif [ -n "$(docker ps -q --filter "name=^$c\$" --filter status=running)" ] &&
    docker exec "$c" pg_isready -q -h 127.0.0.1 -U bronzeward; then
    # A container started by an older task keeps the default; it may serve another checkout, so
    # it is reported, not replaced.
    locks=$(docker exec "$c" psql -h 127.0.0.1 -U bronzeward -Atc 'SHOW max_locks_per_transaction')
    if [ "$locks" != 256 ]; then
      echo "dev-db: $c runs max_locks_per_transaction=$locks, not 256; run ${BW_DEV_PFX}mise run dev-down, then ${BW_DEV_PFX}mise run dev-db" >&2
      exit 1
    fi
    echo "$BW_DEV_PG_DSN"
    exit 0
  fi
  sleep 1
done
echo "dev-db: $c was not running and ready within 30s (docker ps -a; docker logs $c)" >&2
exit 1
'''

[tasks.dev-bao]
description = "Start a disposable development OpenBao at the fixture's image pin: dev mode, in memory, http://127.0.0.1:11200, root token bw-dev-root-token; BW_DEV_INSTANCE=<name> starts bw-dev-bao-<name> on 127.0.0.1:13000+slot instead"
# The image's default command is `server -dev`: unsealed, KV v2 at secret/, nothing persisted, and
# removed on stop (mise run dev-down). The root token is a fixed, synthetic value, bound to
# loopback like dev-db's trust auth; mise run go-db and mise run browser-auth's disposable
# deployment default to it. Never a real deployment's provider, and not the fixture's Raft server.
# The container's name and port come from scripts/dev/instance.sh, as dev-db's do.
run = '''
. scripts/dev/instance.sh || exit 1
c=$BW_DEV_BAO_CONTAINER
image=$(sed -n 's/^OPENBAO_IMAGE=//p' fixtures/versions.env)
# As dev-db: every path waits for readiness, a container being removed is waited out, and a taken
# port fails at once.
for _ in $(seq 30); do
  if [ -z "$(docker ps -aq --filter "name=^$c\$")" ]; then
    out=$(docker run -d --rm --name "$c" -e BAO_DEV_ROOT_TOKEN_ID=bw-dev-root-token \
      -e BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200 -p "127.0.0.1:$BW_DEV_BAO_PORT:8200" "$image" 2>&1) || {
      echo "$out" >&2
      case $out in
      *"port is already allocated"* | *"address already in use"*)
        docker rm -f "$c" >/dev/null 2>&1 || true
        echo "dev-bao: 127.0.0.1:$BW_DEV_BAO_PORT is taken${BW_DEV_INSTANCE:+ (BW_DEV_INSTANCE=$BW_DEV_INSTANCE may share its slot with another instance: use another name)}" >&2
        exit 1
        ;;
      esac
    }
  elif [ -n "$(docker ps -q --filter "name=^$c\$" --filter status=running)" ] &&
    docker exec "$c" bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; then
    echo "$BW_DEV_BAO_ADDR"
    exit 0
  fi
  sleep 1
done
echo "dev-bao: $c was not running and unsealed within 30s (docker ps -a; docker logs $c)" >&2
exit 1
'''

[tasks.dev-idp]
description = "Start the test identity provider (Zitadel at the fixture's pin) on http://localhost:11080, seeded with the synthetic humans; prints the issuer, project and client IDs. BW_DEV_INSTANCE=<name> starts bw-dev-idp-<name> on 14000+slot, with its variables in .dev/idp-<name>/"
# Everything is in fixtures/dev-idp, kept out of this file because mise renders run scripts with
# Tera. Its test variables go to .dev/idp/idp.env (gitignored; .dev/idp-<name>/idp.env for a named
# instance); mise run go-idp reads them.
run = "fixtures/dev-idp up"

[tasks.dev-idp-down]
description = "Remove dev-idp's containers with their data, its network and .dev/idp/, leaving dev-db and dev-bao running; with BW_DEV_INSTANCE=<name>, only that instance's"
# mise run dev-down does this too, after stopping the containers every worktree shares.
run = "fixtures/dev-idp down"

[tasks.go-idp]
description = "Run the sign-in self-test and bronzewardctl's sign-in against mise run dev-idp's provider and mise run dev-db's database (BW_DEV_INSTANCE's, when set)"
# BW_REQUIRE_IDP=1: the test fails, not skips, when the provider's variables are missing.
run = '''
. scripts/dev/instance.sh || exit 1
[ -f "$BW_DEV_IDP_DIR/idp.env" ] || { echo "go-idp: no $BW_DEV_IDP_DIR/idp.env; run ${BW_DEV_PFX}mise run dev-idp first" >&2; exit 1; }
set -a
. "./$BW_DEV_IDP_DIR/idp.env"
set +a
: "${BW_TEST_PG_DSN:=$BW_DEV_PG_DSN}"
export BW_TEST_PG_DSN
BW_REQUIRE_IDP=1 BW_REQUIRE_PG=1 go test -count=1 -timeout 10m -run '^Test(Login)?IdentityProvider' -v ./internal/api/ ./internal/clitest/
'''

[tasks.dev-down]
description = "Stop dev-db's, dev-bao's and dev-idp's containers, which removes them and their data; with BW_DEV_INSTANCE=<name>, only that instance's"
# dev-db and dev-bao run with --rm, so stopping is removing; dev-idp down removes its containers
# and network. Returns once they are gone, so their ports are free for the next start. The default
# instance's are shared by every worktree on this host; a named instance's are stopped by naming it,
# and the default's are left running (scripts/dev/instance.sh).
run = '''
. scripts/dev/instance.sh || exit 1
# Each query is assigned before it is tested, so a docker failure (no daemon, no permission) fails
# the task under errexit instead of reading as an absent container.
for c in "$BW_DEV_PG_CONTAINER" "$BW_DEV_BAO_CONTAINER"; do
  running=$(docker ps -q --filter "name=^$c\$")
  [ -z "$running" ] || docker stop "$c" >/dev/null
  for _ in $(seq 30); do
    present=$(docker ps -aq --filter "name=^$c\$")
    [ -n "$present" ] || continue 2
    sleep 1
  done
  echo "dev-down: $c was still present after 30s (docker ps -a; docker rm -f $c)" >&2
  exit 1
done
fixtures/dev-idp down
'''

[tasks.build]
description = "Build the server into bin/bronzeward and the fixture OIDC issuer into bin/oidc-fixture (bin/ is gitignored)"
run = """
go build -o bin/bronzeward ./cmd/bronzeward
go build -o bin/oidc-fixture ./fixtures/oidc
"""

[tasks.dev]
description = "Run the server on 127.0.0.1:8080 against dev-db and dev-bao, with the fixture OIDC issuer on 127.0.0.1:5556, until Ctrl-C; mise run dev-down removes the containers"
# examples/bronzeward.yaml's issuer, with a synthetic key generated once into .dev/ (gitignored).
# migrate skips what is already applied, so it runs on every start, but only while no server
# answers on 8080: the containers are shared by every worktree, and the schema changes only with
# the service stopped (persistence-api.md §11). The issuer runs in the background (where Ctrl-C
# does not reach it), must answer its discovery document before the server starts, and is stopped
# when the server exits; the containers stay up for mise run go-db.
# Not for a named instance (BW_DEV_INSTANCE): examples/bronzeward.yaml names the default dev-db and
# dev-bao, so the refusal comes first, before dev-db and dev-bao start containers that nothing uses.
run = '''
[ -z "${BW_DEV_INSTANCE:-}" ] || { echo "dev: not for BW_DEV_INSTANCE=$BW_DEV_INSTANCE (examples/bronzeward.yaml names the default dev-db and dev-bao); unset it" >&2; exit 1; }
# One after the other, not as dependencies: a dependency would start its containers before the
# refusal above, and a run array of tasks needs a newer mise than the rest of this file.
mise run dev-db || exit 1
mise run dev-bao || exit 1
mise run build || exit 1
# A port is free only when the connection is refused (curl exit 7); a listener that accepts and
# never answers counts as taken.
for port in 8080 5556; do
  rc=0
  curl -s --noproxy '*' -o /dev/null --max-time 2 "http://127.0.0.1:$port/" || rc=$?
  if [ "$rc" -ne 7 ]; then
    echo "dev: 127.0.0.1:$port is in use (another mise run dev, perhaps in another worktree); stop it first" >&2
    exit 1
  fi
done
mkdir -p .dev
[ -f .dev/oidc.key ] || bin/oidc-fixture keygen -out .dev/oidc.key
bin/bronzeward migrate -config examples/bronzeward.yaml
bin/oidc-fixture serve -key .dev/oidc.key -issuer http://127.0.0.1:5556 &
issuer=$!
# Waited for, so 5556 is free once the task returns.
trap 'kill "$issuer" 2>/dev/null || true; wait "$issuer" 2>/dev/null || true' EXIT
if ! curl -sf --noproxy '*' -o /dev/null --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 \
  http://127.0.0.1:5556/.well-known/openid-configuration || ! kill -0 "$issuer" 2>/dev/null; then
  echo "dev: the fixture issuer did not come up on 127.0.0.1:5556 (see its error above)" >&2
  exit 1
fi
# Ctrl-C is how this task ends: exit 0 once the server has shut down, not as killed by a signal.
trap 'exit 0' INT TERM
echo 'dev: curl -i http://127.0.0.1:8080/livez' >&2
echo 'dev: curl -s -H "Authorization: Bearer $(bin/oidc-fixture mint -key .dev/oidc.key -issuer http://127.0.0.1:5556 -human h-viewer)" http://127.0.0.1:8080/api/v1/acts' >&2
bin/bronzeward serve -config examples/bronzeward.yaml
'''

[tasks."web:install"]
description = "Install web/'s locked dependencies into web/node_modules (gitignored) when the lockfile is newer"
run = "[ web/node_modules/.package-lock.json -nt web/package-lock.json ] || npm --prefix web ci"

[tasks."web:position-cases"]
description = "Write web/src/position-cases.json: the documents of web/src/position.test.ts and the references the go-yaml oracle (experiments/scanner-cross-line) lists in each; needs go"
run = "node scripts/dev/position-cases.mjs"

[tasks.web]
description = "Generate the API types from api/openapi.yaml, then type-check, unit-test and build web/ into web/dist"
depends = ["web:install"]
dir = "web"
run = "npm run verify"

[tasks.browser]
description = "The real-browser cases against the test static host (BW_BROWSERS, default chrome,firefox), then the artifact scan"
# Needs no server, database or identity provider: the host answers every API request with a
# redirect (fixtures/webhost -redirect-api). The canary is the run's synthetic value (§11.5).
depends = ["web"]
run = '''
go build -o bin/webhost ./fixtures/webhost
canary="BWSYNTH-web-$(od -An -tx1 -N8 /dev/urandom | tr -d ' \n')"
rm -rf web/e2e/out
cd web
# wdio runs with a TMPDIR of its own (scripts/ci/browser-tmp.sh, #430), refused when too long for
# Chrome's socket; a browser profile left in it fails the run, and a failed run keeps its own status.
# wdio keeps its browser and driver downloads where it cached them before.
export BW_WDIO_CACHE=${BW_WDIO_CACHE:-${TMPDIR:-/tmp}}
run_tmp=$(bash ../scripts/ci/browser-tmp.sh start browser)
rc=0
TMPDIR=$run_tmp BW_WEB_CANARY=$canary npx wdio run e2e/wdio.conf.ts || rc=$?
bash ../scripts/ci/browser-tmp.sh finish browser "$run_tmp" || { [ "$rc" -ne 0 ] || rc=1; }
[ "$rc" -eq 0 ] || exit "$rc"
node e2e/scan.ts e2e/out "$canary"
'''

[tasks.browser-auth]
description = "The AUTH real-browser cases (BW_BROWSERS) against two disposable servers on mise run dev-db's database, one trusting mise run dev-idp's provider and one the fixture issuer, then the artifact scan; the cases' disposable deployment uses mise run dev-bao's OpenBao; the database, OpenBao and provider of BW_DEV_INSTANCE, when set"
# web/e2e/auth.conf.ts creates and drops the servers' databases, and creates and removes its own
# OpenBao policies, digest key and tokens (web/e2e/bao.ts). The scan also looks for the provider's
# synthetic password and login token, and for any JWT.
depends = ["web", "build"]
run = '''
# BW_DEV_PG_PORT, BW_DEV_BAO_ADDR and BW_DEV_IDP_DIR reach web/e2e/auth.conf.ts, which takes the
# database, OpenBao and the provider's variables from the instance (scripts/dev/instance.sh); the
# browser ports are its own.
. scripts/dev/instance.sh || exit 1
[ -f "$BW_DEV_IDP_DIR/idp.env" ] || { echo "browser-auth: no $BW_DEV_IDP_DIR/idp.env; run ${BW_DEV_PFX}mise run dev-idp first" >&2; exit 1; }
go build -o bin/webhost ./fixtures/webhost
# The cases' disposable deployment runs this build, which holds the fixture interrupt seam (REC-04 (b),
# PROT-06 case 4). The other servers run bin/bronzeward, which holds none.
go build -tags fixtureinterrupt -o bin/bronzeward-interrupt ./cmd/bronzeward
# The seeding step of web/e2e/auth.conf.ts (ginsys/bronzeward#822): internal/api's TestE2ESeed, which
# uses the helpers the API tests use, compiled once and run against a case's fresh database.
go test -c -o bin/e2eseed.test ./internal/api
canary="BWSYNTH-web-$(od -An -tx1 -N8 /dev/urandom | tr -d ' \n')"
password=$(. "./$BW_DEV_IDP_DIR/idp.env" && printf %s "$BW_TEST_IDP_PASSWORD")
rm -rf web/e2e/out
mkdir -p web/e2e/out
cd web
# The run's console goes to a file the scan reads, not to the job log: a failing expect prints its
# received value. The scan runs after a failed run too, and the console is shown only once it passes.
rc=0
# As in browser: a TMPDIR of its own (scripts/ci/browser-tmp.sh, #430).
export BW_WDIO_CACHE=${BW_WDIO_CACHE:-${TMPDIR:-/tmp}}
run_tmp=$(bash ../scripts/ci/browser-tmp.sh start browser-auth)
TMPDIR=$run_tmp BW_WEB_CANARY=$canary npx wdio run e2e/auth.conf.ts > e2e/out/console.log 2>&1 || rc=$?
left=
bash ../scripts/ci/browser-tmp.sh finish browser-auth "$run_tmp" || left=1
node e2e/scan.ts e2e/out "$canary" "$password" "@../$BW_DEV_IDP_DIR/login.pat" || exit 1
cat e2e/out/console.log
[ -z "$left" ] || [ "$rc" -ne 0 ] || rc=1
exit "$rc"
'''

[tasks.upstream-sync]
description = "Check out go-kure/.github into upstream/ (gitignored) at the commit ci.yml pins the action-pin checker to"
# Single source of truth for the revision: the `check-action-pins@<sha>` pin in ci.yml, so the
# local check and CI run the same checker. Bumping the pin there is the only edit needed.
run = """
sha=$(grep -oE 'check-action-pins@[0-9a-f]{40}' .github/workflows/ci.yml | head -1 | cut -d@ -f2)
[ -n "$sha" ] || { echo "upstream-sync: no 40-char check-action-pins pin in .github/workflows/ci.yml" >&2; exit 1; }
[ -d upstream/.git ] || git clone --quiet --no-checkout https://github.com/go-kure/.github upstream
git -C upstream rev-parse --quiet --verify "$sha^{commit}" >/dev/null || git -C upstream fetch --quiet origin
git -C upstream checkout --quiet --detach "$sha"
"""

[tasks.action-pins]
description = "Every third-party action ref is a 40-char commit SHA (go-kure's checker, ginsys reusables admitted at @main)"
depends = ["upstream-sync"]
# The checker runs from the pinned commit's object, not from upstream/'s working tree: that tree is
# gitignored, so a local edit there would run unseen by anything that inspects this checkout.
run = """
sha=$(grep -oE 'check-action-pins@[0-9a-f]{40}' .github/workflows/ci.yml | head -1 | cut -d@ -f2)
[ -n "$sha" ] || { echo "action-pins: no 40-char check-action-pins pin in .github/workflows/ci.yml" >&2; exit 1; }
checker=$(git --no-replace-objects -C upstream show "$sha:scripts/check-action-pins.sh") || exit 1
FIRST_PARTY_WORKFLOW_RE='^(go-kure|ginsys)/[^/]+/\\.github/workflows/[^@]+@main$' bash -c "$checker" check-action-pins .
"""

[tasks.verify]
description = "Everything ci.yml runs except go-db, idp, the browser jobs and the packaging jobs (they need running services, browsers, Docker or two builds; mise run go-db, mise run go-idp, mise run browser, mise run package, package:check, hosting): lint, tests, docs, site, whitespace, commit subjects, go, web, action pins"
depends = ["lint", "test", "docs", "site", "whitespace", "commit-lint", "go", "web", "action-pins"]
