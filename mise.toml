[tools]
# ci.yml installs from this list (jdx/mise-action); a bump here is the only edit needed. A new
# tool also needs naming in the `install_args` of every job that runs a task using it, since each
# job installs only what it names.
actionlint = "1.7.12"
shellcheck = "0.11.0"
go = "1.27.1"

[tasks.lint]
description = "actionlint on the workflows, shellcheck on the scripts"
# SHELLCHECK_OPTS is cleared so a shell default such as --exclude=SC2086 cannot hide locally a
# finding CI reports with a clean environment.
run = """
env -u SHELLCHECK_OPTS actionlint
env -u SHELLCHECK_OPTS shellcheck scripts/ci/*.sh scripts/test/*.sh
env -u SHELLCHECK_OPTS shellcheck -x fixtures/lib.sh fixtures/bin/* fixtures/scenarios/* experiments/e1-secret-ingress/run/* \
  experiments/e5-provider-capabilities/run/* experiments/e5-retention-classification/run/* \
  experiments/e4-dispatch-safety/run/* \
  experiments/e5-key-loss-restoration/run/* \
  experiments/e2-structural-references/run/* \
  experiments/e3-talos-compatibility/run/* \
  experiments/e4-database-semantics/run/* \
  experiments/e2-sensitivity-provenance/run/*
"""

[tasks.test]
description = "Fixture tests for scripts/ci/commit-lint.sh"
run = "bash scripts/test/commit-lint-test.sh"

[tasks.docs]
description = "Documentation checks (needs Python 3.9+ with PyYAML 6)"
run = "python3 scripts/verify-docs.py"

[tasks."site:install"]
description = "Install requirements-site.txt into .venv-site (gitignored; needs Python 3.10+)"
run = """
[ -x .venv-site/bin/python ] || python3 -m venv .venv-site
.venv-site/bin/pip install --quiet --disable-pip-version-check -r requirements-site.txt
"""

[tasks.site]
description = "Run the link-rewrite tests, then build the documentation site into site/ with --strict, as ci.yml's site job does"
depends = ["site:install"]
# NO_MKDOCS_2_WARNING: mkdocs-material's MkDocs 2.0 banner, printed on every run (see
# requirements-site.txt for why the site stays on 1.x).
env = { NO_MKDOCS_2_WARNING = "true" }
run = """
.venv-site/bin/python scripts/test/site-hooks-test.py
.venv-site/bin/mkdocs build --strict
"""

[tasks."site:serve"]
description = "Serve the documentation site at http://127.0.0.1:8000 with live reload"
depends = ["site:install"]
env = { NO_MKDOCS_2_WARNING = "true" }
run = ".venv-site/bin/mkdocs serve --strict"

[tasks.whitespace]
description = "git diff --check over the whole tree at HEAD and over the working tree, as ci.yml's docs job does"
run = """
git diff --check "$(git hash-object -t tree /dev/null)" HEAD
git diff --check
"""

[tasks.commit-lint]
description = "Conventional-commit subjects on this branch's commits since origin/main (fetch it first)"
run = """
base=$(git merge-base origin/main HEAD) || { echo "commit-lint: no merge-base with origin/main; fetch it first" >&2; exit 1; }
scripts/ci/commit-lint.sh "$base" HEAD
"""

[tasks.go]
description = "Build, vet, format-check and test the root module and the Phase-0 experiment modules"
# The root module (cmd/, internal/, fixtures/oidc) comes first. Its go.mod carries `ignore ./experiments`, so
# the root `./...` never sweeps disposable evidence code into the implementation: the nested
# go.mod files alone do not suffice, since experiments/e3-talos-compatibility/machinery/src has
# none. Each experiment is its own module, checked with `go -C <dir>`, one line per module.
# `mod tidy -diff` fails instead of rewriting, so CI reports a stale go.mod rather than hiding it.
run = """
gofmt -l cmd internal fixtures/oidc | { ! grep . ; }
go mod verify
go mod tidy -diff
go build -o /dev/null ./...
go vet ./...
go test ./...
gofmt -l experiments/e1-secret-ingress | { ! grep . ; }
go -C experiments/e1-secret-ingress mod verify
go -C experiments/e1-secret-ingress mod tidy -diff
go -C experiments/e1-secret-ingress build ./...
go -C experiments/e1-secret-ingress vet ./...
go -C experiments/e1-secret-ingress test ./...
gofmt -l experiments/e4-dispatch-safety | { ! grep . ; }
go -C experiments/e4-dispatch-safety mod verify
go -C experiments/e4-dispatch-safety mod tidy -diff
go -C experiments/e4-dispatch-safety build -o /dev/null ./...
go -C experiments/e4-dispatch-safety vet ./...
go -C experiments/e4-dispatch-safety test ./...
gofmt -l experiments/e2-structural-references | { ! grep . ; }
go -C experiments/e2-structural-references mod verify
go -C experiments/e2-structural-references mod tidy -diff
go -C experiments/e2-structural-references build -o /dev/null ./...
go -C experiments/e2-structural-references vet ./...
go -C experiments/e2-structural-references test ./...
gofmt -l experiments/e3-talos-compatibility/machinery/src | { ! grep . ; }
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.12.12 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.0 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.13.10 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.14.1 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 mod verify
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 mod tidy -diff
go -C experiments/e3-talos-compatibility/machinery/v1.15.0-alpha.0 vet ./...
go -C experiments/e3-talos-compatibility/machinery/v1.13.6 test ./...
gofmt -l experiments/e4-database-semantics | { ! grep . ; }
go -C experiments/e4-database-semantics mod verify
go -C experiments/e4-database-semantics mod tidy -diff
go -C experiments/e4-database-semantics build -o /dev/null ./...
go -C experiments/e4-database-semantics vet ./...
go -C experiments/e4-database-semantics test ./...
gofmt -l experiments/e2-sensitivity-provenance | { ! grep . ; }
go -C experiments/e2-sensitivity-provenance mod verify
go -C experiments/e2-sensitivity-provenance mod tidy -diff
go -C experiments/e2-sensitivity-provenance build -o /dev/null ./...
go -C experiments/e2-sensitivity-provenance vet ./...
go -C experiments/e2-sensitivity-provenance test ./...
"""

[tasks.go-db]
description = "Test the root module against PostgreSQL and OpenBao (default: mise run dev-db's and dev-bao's); a missing service fails instead of skipping"
# CI's go-db job points BW_TEST_PG_DSN and BW_TEST_BAO_* at its service containers. Locally they
# default to mise run dev-db and mise run dev-bao; any PostgreSQL 17 role that may create
# databases, and any OpenBao root token on a disposable server, also work.
run = '''
: "${BW_TEST_PG_DSN:=postgres://bronzeward@127.0.0.1:55433/bronzeward?sslmode=disable}"
: "${BW_TEST_BAO_ADDR:=http://127.0.0.1:58201}"
: "${BW_TEST_BAO_TOKEN:=bw-dev-root-token}"
export BW_TEST_PG_DSN BW_TEST_BAO_ADDR BW_TEST_BAO_TOKEN
BW_REQUIRE_PG=1 BW_REQUIRE_BAO=1 go test -count=1 ./...
'''

[tasks.dev-db]
description = "Start a disposable development PostgreSQL at the fixture's image pin: 127.0.0.1:55433, user bronzeward, no password"
# Trust auth, bound to loopback, removed on stop (mise run dev-down). examples/bronzeward.yaml
# and mise run go-db default to it. Never a deployment database.
run = '''
image=$(sed -n 's/^POSTGRES_IMAGE=//p' fixtures/versions.env)
# Every path waits for readiness: an existing container may still be initialising, and one just
# stopped may still be being removed (--rm), so it is started only once it is gone.
# -h 127.0.0.1: the entrypoint's init server listens on the socket only, so TCP readiness means
# the real server is up. (No docker --format templates: mise renders run scripts with Tera.)
for _ in $(seq 30); do
  if [ -z "$(docker ps -aq --filter 'name=^bw-dev-pg$')" ]; then
    docker run -d --rm --name bw-dev-pg -e POSTGRES_USER=bronzeward -e POSTGRES_HOST_AUTH_METHOD=trust \
      -p 127.0.0.1:55433:5432 "$image" >/dev/null || true
  elif [ -n "$(docker ps -q --filter 'name=^bw-dev-pg$' --filter status=running)" ] &&
    docker exec bw-dev-pg pg_isready -q -h 127.0.0.1 -U bronzeward; then
    echo "postgres://bronzeward@127.0.0.1:55433/bronzeward?sslmode=disable"
    exit 0
  fi
  sleep 1
done
echo "dev-db: bw-dev-pg was not running and ready within 30s (docker ps -a; docker logs bw-dev-pg)" >&2
exit 1
'''

[tasks.dev-bao]
description = "Start a disposable development OpenBao at the fixture's image pin: dev mode, in memory, http://127.0.0.1:58201, root token bw-dev-root-token"
# The image's default command is `server -dev`: unsealed, KV v2 at secret/, nothing persisted, and
# removed on stop (mise run dev-down). The root token is a fixed, synthetic value, bound to
# loopback like dev-db's trust auth; mise run go-db defaults to it. Never a deployment provider,
# and not the fixture's Raft server.
run = '''
image=$(sed -n 's/^OPENBAO_IMAGE=//p' fixtures/versions.env)
# As dev-db: every path waits for readiness, and a container being removed is waited out.
for _ in $(seq 30); do
  if [ -z "$(docker ps -aq --filter 'name=^bw-dev-bao$')" ]; then
    docker run -d --rm --name bw-dev-bao -e BAO_DEV_ROOT_TOKEN_ID=bw-dev-root-token \
      -e BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200 -p 127.0.0.1:58201:8200 "$image" >/dev/null || true
  elif [ -n "$(docker ps -q --filter 'name=^bw-dev-bao$' --filter status=running)" ] &&
    docker exec bw-dev-bao bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; then
    echo "http://127.0.0.1:58201"
    exit 0
  fi
  sleep 1
done
echo "dev-bao: bw-dev-bao was not running and unsealed within 30s (docker ps -a; docker logs bw-dev-bao)" >&2
exit 1
'''

[tasks.dev-down]
description = "Stop dev-db's and dev-bao's containers, which removes them and their data"
# Both run with --rm, so stopping is removing. Returns once they are gone, so their ports are free
# for the next mise run dev-db or dev-bao. They are shared by every worktree on this host.
run = '''
# Each query is assigned before it is tested, so a docker failure (no daemon, no permission) fails
# the task under errexit instead of reading as an absent container.
for c in bw-dev-pg bw-dev-bao; do
  running=$(docker ps -q --filter "name=^$c\$")
  [ -z "$running" ] || docker stop "$c" >/dev/null
  for _ in $(seq 30); do
    present=$(docker ps -aq --filter "name=^$c\$")
    [ -n "$present" ] || continue 2
    sleep 1
  done
  echo "dev-down: $c was still present after 30s (docker ps -a; docker rm -f $c)" >&2
  exit 1
done
'''

[tasks.build]
description = "Build the server into bin/bronzeward and the fixture OIDC issuer into bin/oidc-fixture (bin/ is gitignored)"
run = """
go build -o bin/bronzeward ./cmd/bronzeward
go build -o bin/oidc-fixture ./fixtures/oidc
"""

[tasks.dev]
description = "Run the server on 127.0.0.1:8080 against dev-db and dev-bao, with the fixture OIDC issuer on 127.0.0.1:5556, until Ctrl-C; mise run dev-down removes the containers"
depends = ["dev-db", "dev-bao", "build"]
# examples/bronzeward.yaml's issuer, with a synthetic key generated once into .dev/ (gitignored).
# migrate skips what is already applied, so it runs on every start, but only while no server
# answers on 8080: the containers are shared by every worktree, and the schema changes only with
# the service stopped (persistence-api.md §11). The issuer runs in the background (where Ctrl-C
# does not reach it), must answer its discovery document before the server starts, and is stopped
# when the server exits; the containers stay up for mise run go-db.
run = '''
for port in 8080 5556; do
  if curl -s -o /dev/null --max-time 2 "http://127.0.0.1:$port/"; then
    echo "dev: 127.0.0.1:$port already answers (another mise run dev, perhaps in another worktree); stop it first" >&2
    exit 1
  fi
done
mkdir -p .dev
[ -f .dev/oidc.key ] || bin/oidc-fixture keygen -out .dev/oidc.key
bin/bronzeward migrate -config examples/bronzeward.yaml
bin/oidc-fixture serve -key .dev/oidc.key -issuer http://127.0.0.1:5556 &
issuer=$!
trap 'kill "$issuer" 2>/dev/null || true' EXIT
if ! curl -sf -o /dev/null --retry 10 --retry-connrefused --retry-delay 1 \
  http://127.0.0.1:5556/.well-known/openid-configuration || ! kill -0 "$issuer" 2>/dev/null; then
  echo "dev: the fixture issuer did not come up on 127.0.0.1:5556 (see its error above)" >&2
  exit 1
fi
# Ctrl-C is how this task ends: exit 0 once the server has shut down, not as killed by a signal.
trap 'exit 0' INT TERM
echo 'dev: curl -i http://127.0.0.1:8080/livez' >&2
echo 'dev: curl -s -H "Authorization: Bearer $(bin/oidc-fixture mint -key .dev/oidc.key -issuer http://127.0.0.1:5556 -human h-viewer)" http://127.0.0.1:8080/api/v1/acts' >&2
bin/bronzeward serve -config examples/bronzeward.yaml
'''

[tasks.upstream-sync]
description = "Check out go-kure/.github into upstream/ (gitignored) at the commit ci.yml pins the action-pin checker to"
# Single source of truth for the revision: the `check-action-pins@<sha>` pin in ci.yml, so the
# local check and CI run the same checker. Bumping the pin there is the only edit needed.
run = """
sha=$(grep -oE 'check-action-pins@[0-9a-f]{40}' .github/workflows/ci.yml | head -1 | cut -d@ -f2)
[ -n "$sha" ] || { echo "upstream-sync: no 40-char check-action-pins pin in .github/workflows/ci.yml" >&2; exit 1; }
[ -d upstream/.git ] || git clone --quiet --no-checkout https://github.com/go-kure/.github upstream
git -C upstream rev-parse --quiet --verify "$sha^{commit}" >/dev/null || git -C upstream fetch --quiet origin
git -C upstream checkout --quiet --detach "$sha"
"""

[tasks.action-pins]
description = "Every third-party action ref is a 40-char commit SHA (go-kure's checker, ginsys reusables admitted at @main)"
depends = ["upstream-sync"]
# The checker runs from the pinned commit's object, not from upstream/'s working tree: that tree is
# gitignored, so a local edit there would run unseen by anything that inspects this checkout.
run = """
sha=$(grep -oE 'check-action-pins@[0-9a-f]{40}' .github/workflows/ci.yml | head -1 | cut -d@ -f2)
[ -n "$sha" ] || { echo "action-pins: no 40-char check-action-pins pin in .github/workflows/ci.yml" >&2; exit 1; }
checker=$(git --no-replace-objects -C upstream show "$sha:scripts/check-action-pins.sh") || exit 1
FIRST_PARTY_WORKFLOW_RE='^(go-kure|ginsys)/[^/]+/\\.github/workflows/[^@]+@main$' bash -c "$checker" check-action-pins .
"""

[tasks.verify]
description = "Everything ci.yml runs except go-db (it needs a database; mise run go-db): lint, tests, docs, site, whitespace, commit subjects, go, action pins"
depends = ["lint", "test", "docs", "site", "whitespace", "commit-lint", "go", "action-pins"]
