# Deployment configuration for local development. `mise run dev` starts the database this DSN
# names (loopback, no password) and the issuer below, migrates and serves; by hand, after
# `mise run dev-db`:
#   go run ./cmd/bronzeward migrate -config examples/bronzeward.yaml
#   go run ./cmd/bronzeward serve -config examples/bronzeward.yaml
# A deployment sets its own listen address and a DSN with credentials.
listen: 127.0.0.1:8080
database:
  dsn: postgres://bronzeward@127.0.0.1:55433/bronzeward?sslmode=disable
# Humans' tokens: the fixture's issuer, started locally as CONTRIBUTING.md shows. A deployment
# names its own identity provider and groups (persistence-api.md §10.1).
auth:
  oidc:
    issuer: http://127.0.0.1:5556
    audience: bronzeward
    groupsClaim: groups
    maxTokenLifetime: 15m
    # Hosts reached over plain http on a network the deployment protects, by exact name; loopback
    # needs no entry. A Kubernetes deployment with TLS terminated at its ingress might list the
    # issuer's service name here.
    # plainHTTPHosts: []
  roles:
    viewer: [bw-viewers]
    author: [bw-authors]
    publisher: [bw-publishers]
    approver: [bw-approvers]
    recovery-admin: [bw-recovery]
  deniedSubjects: []
# Execution timing (execution-recovery.md §5.2). maxTransportDeadline has no default: the longest
# a machine-facing call may take, which the deployment knows, in whole seconds of at least 1s.
# settleFloor defaults to 30s.
# planDefaults are what a plan binds when its creation request leaves a value out
# (persistence-api.md choice §17.37), each a whole number of seconds; shown here at their defaults. The
# transport deadline defaults to 1m, or to maxTransportDeadline if that is lower.
execution:
  maxTransportDeadline: 5m
  planDefaults:
    expiry: 24h
    maxObservationAge: 5m
    checkValidity: 5m
    transportDeadline: 1m
    verificationDeadline: 10m
    maxAttempts: 3
# The secret provider (compilation.md §4.1), optional: without it an ingestion start answers
# 503. The key
# names are the fixture's; the four keys are distinct, and artifact is the key artifacts are
# encrypted under (compilation.md §11). Each token file holds one identity's static OpenBao token,
# mode 0600, never renewed, named by an absolute path in clean form, and the files are distinct
# (a symlinked directory or a hard link giving one file two names is not detected here):
# ingestion's, the compiler's
# (compilation.md §1) and the metadata identity's (dependency-monitor.md §4), under which every
# server with this block runs the dependency monitor (alert lines on stderr). `mise run dev-bao`
# starts a dev-mode OpenBao on loopback for tests, without these keys or token files. Each
# cluster's talosconfig is an operator-written provider secret at access/talos/<cluster id>
# (persistence-api.md §3.3), not a file named here. reportTokenFile, optional, holds the
# orphan-report identity's token for `bronzeward orphans` (persistence-api.md §6.4), under the
# same rules; the server never reads it.
# provider:
#   address: http://127.0.0.1:58201
#   keys: {baseline: bw-baseline, staging: bw-staging, digest: bw-digest, artifact: bw-artifact}
#   ingestionTokenFile: /etc/bronzeward/openbao-ingestion.token
#   compilerTokenFile: /etc/bronzeward/openbao-compiler.token
#   metadataTokenFile: /etc/bronzeward/openbao-metadata.token
#   reportTokenFile: /etc/bronzeward/openbao-report.token
# Required with provider, refused without it: the staging claims' timers (compilation.md §3.2
# requires only heartbeat < lease < absoluteExpiry; the values are open) and this instance's
# name, which starts the owner identity of its claims. Publish jobs run under the same heartbeat
# and lease (persistence-api.md §5.1, choice §17.34): with both blocks the server runs a publish
# worker, which polls every heartbeat for a queued job or one whose lease lapsed. The server
# writes due claims abandoned once at startup and then every sweep interval (compilation.md
# §3.5); without this block it still sweeps, every minute, for claims another instance left
# behind, and answers ingestion starts and publications 503.
# ingestion:
#   instance: a
#   heartbeat: 5s
#   lease: 15s
#   absoluteExpiry: 10m
#   sweep: 15s
