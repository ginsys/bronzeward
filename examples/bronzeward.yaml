# Deployment configuration for local development. `mise run dev-db` starts the database this DSN
# names (loopback, no password); then:
#   go run ./cmd/bronzeward migrate -config examples/bronzeward.yaml
#   go run ./cmd/bronzeward serve -config examples/bronzeward.yaml
# A deployment sets its own listen address and a DSN with credentials.
listen: 127.0.0.1:8080
database:
  dsn: postgres://bronzeward@127.0.0.1:55433/bronzeward?sslmode=disable
# Humans' tokens: the fixture's issuer, started locally as CONTRIBUTING.md shows. A deployment
# names its own identity provider and groups (persistence-api.md §10.1).
auth:
  oidc:
    issuer: http://127.0.0.1:5556
    audience: bronzeward
    groupsClaim: groups
    maxTokenLifetime: 15m
  roles:
    viewer: [bw-viewers]
    author: [bw-authors]
    publisher: [bw-publishers]
    approver: [bw-approvers]
    recovery-admin: [bw-recovery]
  deniedSubjects: []
