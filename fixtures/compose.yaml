# Database and provider candidates for the feasibility experiments. Started by bin/up, which
# passes versions.env and the generated .state/secrets.env. Both services publish on localhost only.
# BW_RUN_ID (exported by bin/up, never in a file) labels both services so that the post-hoc lookup
# in bin/up, done by name and by the labels Compose gives every container of this project, can tell
# the one Compose just made from a replacement created under the same name and project labels in
# the moment between: only the one carrying this run's value is trusted, the same binding
# down-compose-volumes already gives the two named volumes below.
name: ${FIXTURE_NAME}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${FIXTURE_NAME}-postgres
    labels:
      bronzeward.fixture.run: ${BW_RUN_ID}
    environment:
      POSTGRES_USER: bronzeward
      POSTGRES_DB: bronzeward
      POSTGRES_PASSWORD: ${BW_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Over TCP on purpose: while the image initializes a new data directory it runs a temporary
    # server on the unix socket only, and a check through that socket reports healthy too early.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bronzeward", "-d", "bronzeward"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Not dev mode: dev mode is in-memory and unseals itself, so it cannot show startup unlock,
  # backup/restore or key loss. Single-node integrated Raft gives a real snapshot API.
  openbao:
    image: ${OPENBAO_IMAGE}
    container_name: ${FIXTURE_NAME}-openbao
    labels:
      bronzeward.fixture.run: ${BW_RUN_ID}
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_LOCAL_CONFIG: >-
        {"storage":{"raft":{"path":"/openbao/file","node_id":"fixture"}},
        "listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],
        "api_addr":"http://127.0.0.1:8200","cluster_addr":"http://127.0.0.1:8201",
        "disable_mlock":true,"ui":false}
    ports:
      - "127.0.0.1:${OPENBAO_PORT}:8200"
    volumes:
      - openbao-data:/openbao/file

  # The server under test: two instances of one image bin/up builds and imports for this run
  # (never pulled), named by its ID in BW_IMAGE. Created, not started, by bin/up: S0 begins from an
  # empty schema, and bin/inject start A|B brings each up. The configuration directory is
  # bind-mounted, not copied, so an edit to deniedSubjects is seen after a kill and a start. Plain
  # http: TLS is terminated in front of the server in a deployment (persistence-api.md §9.1).
  # BW_IMAGE, BW_UID, BW_GID and BW_STATE are exported by bin/up, never in a file, like BW_RUN_ID.
  bronzeward-a:
    image: ${BW_IMAGE}
    pull_policy: never
    container_name: ${FIXTURE_NAME}-bronzeward-a
    labels:
      bronzeward.fixture.run: ${BW_RUN_ID}
    user: "${BW_UID}:${BW_GID}"
    command: ["serve", "-config", "/etc/bronzeward/config.yaml"]
    ports:
      - "127.0.0.1:${SERVER_A_PORT}:8080"
    volumes:
      - ${BW_STATE}/server/a:/etc/bronzeward:ro

  bronzeward-b:
    image: ${BW_IMAGE}
    pull_policy: never
    container_name: ${FIXTURE_NAME}-bronzeward-b
    labels:
      bronzeward.fixture.run: ${BW_RUN_ID}
    user: "${BW_UID}:${BW_GID}"
    command: ["serve", "-config", "/etc/bronzeward/config.yaml"]
    ports:
      - "127.0.0.1:${SERVER_B_PORT}:8080"
    volumes:
      - ${BW_STATE}/server/b:/etc/bronzeward:ro

  # The disposable OIDC issuer, reached by A and B as http://issuer:5556, a host their
  # configuration lists in plainHTTPHosts. Not published: tokens are minted offline from its key.
  issuer:
    image: ${BW_IMAGE}
    pull_policy: never
    container_name: ${FIXTURE_NAME}-issuer
    labels:
      bronzeward.fixture.run: ${BW_RUN_ID}
    user: "${BW_UID}:${BW_GID}"
    entrypoint: ["/oidc"]
    command: ["serve", "-key", "/etc/oidc/key.json", "-issuer", "http://issuer:5556", "-listen", "0.0.0.0:5556"]
    volumes:
      - ${BW_STATE}/issuer:/etc/oidc:ro

volumes:
  postgres-data:
  openbao-data:
