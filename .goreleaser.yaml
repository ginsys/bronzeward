# The release archives of ginsys/bronzeward#262 (P3, P6): bronzewardctl for the four decided
# targets, the Linux server binary, and SHA256SUMS over them and the web tarball that
# scripts/release/web-package.sh writes to build/ first. `mise run package` runs this in snapshot
# mode; nothing here publishes (release.disable). Every input of an archive is fixed by the commit:
# the version comes from BW_VERSION, every time from the commit time.
version: 2
project_name: bronzeward

env:
  - CGO_ENABLED=0

builds:
  - id: bronzewardctl
    main: ./cmd/bronzewardctl
    binary: bronzewardctl
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=true]
    ldflags: ["-s -w -X main.version={{ .Env.BW_VERSION }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: bronzeward
    main: ./cmd/bronzeward
    binary: bronzeward
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=true]
    ldflags: ["-s -w -X github.com/ginsys/bronzeward/internal/api.version={{ .Env.BW_VERSION }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

# Entry owner, mode and time fixed, so the archive bytes depend on the commit alone.
archives:
  - id: bronzewardctl
    ids: [bronzewardctl]
    formats: [tar.gz]
    name_template: 'bronzewardctl_{{ trimprefix .Env.BW_VERSION "v" }}_{{ .Os }}_{{ .Arch }}'
    builds_info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}
    files:
      - {src: LICENSE-STATUS.md, info: &file_info {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}}
      - {src: build/THIRD_PARTY_NOTICES.txt, strip_parent: true, info: *file_info}
  - id: bronzeward
    ids: [bronzeward]
    formats: [tar.gz]
    name_template: 'bronzeward_{{ trimprefix .Env.BW_VERSION "v" }}_{{ .Os }}_{{ .Arch }}'
    builds_info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}
    files:
      - {src: LICENSE-STATUS.md, info: *file_info}
      - {src: build/THIRD_PARTY_NOTICES.txt, strip_parent: true, info: *file_info}

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: build/bronzeward-web_*.tar.gz

snapshot:
  version_template: '{{ trimprefix .Env.BW_VERSION "v" }}'

changelog:
  disable: true

# GoReleaser only builds. Release / Publish (.github/workflows/release-publish.yml) publishes these
# same snapshot archives with their signature and SBOMs, and waits for the licence (#16).
release:
  disable: true
