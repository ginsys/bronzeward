# Shared conformance case records (docs/spec/client-contracts.md §12) of operation watch (#354,
# decision T23 of #258), run in this order by operations_test.go TestOperations against a disposable
# bronzeward serve with an OpenBao provider (the test's, through baotest), behind the in-process TLS
# injector. Data is synthetic: fixture-issuer tokens for the humans h-all (author, publisher and
# approver), h-approver and h-recovery; a Talos stand-in (talostest) on loopback for the seeded
# machine. Before the cases, the machine is published twice, adopted by a plan of h-all that
# h-approver approves, and the adoption completes. Each later case starts an apply-config operation
# the same way, except where its setup says otherwise.
#
# Every case's argv, standard output and standard error are scanned for the tokens and for the
# stand-in's secrets.

- id: PAGE-01
  setup: the adoption's operation, completed
  action: operation watch op_...
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream"
    - "GET /api/v1/operations/op_.../events, the JSON event pages, one request per page"
    - GET /api/v1/operations/op_..., the operation read
    - "GET /api/v1/operations/op_.../events, the JSON event pages again, one request per page, for the server time of the event that records the end"
  fault: >-
    the injector answers the stream request with the JSON page, as a server without a stream does,
    and sets limit=1 on every events request, so the pages hold one event each
  expect:
    client: >-
      takes the JSON answer as a server without a stream, reads the operation, sees its terminal
      state, and reads the pages from the start, following each page's next to the last page; then
      lists the pages once more, because a streamed or drained event carries no time, and takes the
      time of the event that records the end for the completion line (for an adoption, its adoption
      event, the first of the two). That is the stream request, one page per event,
      and one page per event again: five requests for the two events
    server: no change; the adoption stays completed
    shown: >-
      each of the operation's two events, adoption and applied-change, once, in order, marked
      "received" with this client's time, as every event line is (the completion line alone shows
      the server's time; two events, because an adoption has no commitment, attempt or state change:
      docs/spec/execution-recovery.md §6.3 step 4 creates its operation directly in completed, and
      the record that sets Applied writes the applied-change entry, internal/api/adoption.go);
      "Completed at <time> (server): adopted; the adoption of plan pln_... records Applied from the
      node's own bytes. Nothing was sent to the machine."; exit 0
    absent: [tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: the JSON pages where no stream opens are internal/client TestWatch's case

- id: EVT-01
  setup: an apply-config operation whose apply the stand-in holds
  action: operation watch op_...
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, no Last-Event-ID"
    - GET /api/v1/operations/op_..., after the stream ends
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, Last-Event-ID: the first event's ID"
  fault: >-
    the injector passes the first stream's headers and first event, then ends the stream; the
    stand-in accepts the held apply once the stream is opened again
  expect:
    client: >-
      reads the operation, which is not terminal, and opens the stream again with Last-Event-ID; ends
      when the operation completes
    server: the operation completed; the machine's Applied is the release
    shown: >-
      each of the operation's events once, in order; "Completed at <time> (server): applied rel_...,
      confirmed by observation obs_..."; exit 0
    absent: [tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: the resumption with Last-Event-ID is internal/client TestWatch's case

- id: AUTH-06
  setup: >-
    an apply-config operation whose apply the stand-in holds; the context's stored sign-in is an
    h-all access token with 80 s left, 20 s beyond the 60 s renewal margin, and refresh token
    BWSYNTH-rt-6, which the fixture provider redeems once for a new h-all token and BWSYNTH-rt-7
  action: operation watch op_...
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, no Last-Event-ID, on the expiring token"
    - "the server ends the stream when the token expires"
    - "GET /api/v1/operations/op_..., 401 (sent by the test's proxy, which is what the server's verifier answers once the token is more than its 60 s skew past exp; a real server accepts the token inside the skew); POST <provider>/token, grant_type refresh_token; the read again, 200"
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, Last-Event-ID, on the renewed token"
  fault: "none; the stand-in accepts the held apply once the stream is opened with Last-Event-ID"
  expect:
    client: >-
      renews the sign-in in process and stores the renewed pair; resumes the stream with
      Last-Event-ID; ends when the operation completes
    server: the operation completed
    shown: >-
      each of the operation's events once, in order; "Completed at <time> (server): applied
      rel_..."; exit 0
    absent: [tokens, refresh tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: a renewal during the wait is internal/client TestWatchRenewal's case

- id: EVT-03
  setup: >-
    an apply-config operation that stays committed: a database trigger refuses every attempt row, so
    none is recorded; the trigger is dropped after the case
  action: operation watch op_... --timeout 5m
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream"
    - "POST /api/v1/operations/op_.../takeovers as h-recovery, by the test: 201, the operation unresolved"
    - "POST /api/v1/operations/op_.../resolutions as h-recovery, by the test, once the stream sent the move to unresolved: 201, to cancelled"
  fault: none
  expect:
    client: reads on to the cancellation that follows the move to unresolved
    server: the operation cancelled by the resolution; no attempt recorded
    shown: >-
      the move to unresolved, cause takeover, before the end; each of the operation's events once, in
      order; "Cancelled at <time> (server): resolution." and the next step, the plan create command
      with the operation's machine quoted and <release> and <operation> bare (not plan show, which
      points back at the operation); "operation op_... ended cancelled" on standard error; exit 4.
      This next step is proved by this case alone, in the clitest chain: the unit tests give the
      same line only against a stand-in server
    absent: [tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: >-
    the outcome lines of each terminal state are cmd/bronzewardctl TestOperationWatch's; that
    unresolved alone does not end the watch is its unresolved case, which ends by --timeout, because
    this case posts the resolution as soon as the move is shown

- id: EVT-02
  setup: an apply-config operation whose apply the stand-in holds until the test ends
  action: >-
    operation watch op_... --timeout 20s, twice, once for each order in which a restore can meet
    the client: the new epoch committed after the reader's operation read, or before it
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, no Last-Event-ID"
    - GET /api/v1/operations/op_..., after the stream ends
    - >-
      GET /api/v1/operations/op_.../events, Accept: text/event-stream, with Last-Event-ID, the first
      event's ID of the earlier epoch, in subcase "stale Last-Event-ID"; without it in subcase "new
      epoch seen first"
  fault: >-
    the injector passes the first stream's headers and first event and ends the stream. The test
    commits a new epoch in the database, as a restore's recovery entry does, and waits until the
    server answers it, at one of two moments. Subcase "stale Last-Event-ID, the server's reset":
    when the reconnect request arrives, after the operation read saw the old epoch. Subcase "new
    epoch seen first, the reader's clear": before the injector ends the first stream, so the
    operation read sees the new epoch
  expect:
    client: >-
      subcase "stale Last-Event-ID": sends the earlier epoch's ID (internal/client/watch.go, the
      reconnect after an operation read of the old epoch), takes the server's reset (the "reset"
      case in stream, which clears the display). Subcase "new epoch seen first": the operation read
      shows an epoch other than the last event's (the stale check after the operation read in
      Watch), so it clears the display and opens the stream with no Last-Event-ID. Both then show
      the events again from the start and say why on standard error; --timeout then ends the watch
    server: >-
      subcase "stale Last-Event-ID": the reset event, then every event of the operation with IDs of
      the new epoch. Subcase "new epoch seen first": every event of the operation with IDs of the new
      epoch, with no reset
    shown: >-
      the first event; the clear line; each of the operation's events once; "Still sending after
      --timeout 20s." and "Follow it again with: bronzewardctl operation watch 'op_...'"; exit 5
    absent: [tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: >-
    the reset is internal/client TestWatch's case; the clear on an operation read of another epoch
    is its case "an event ID of another epoch ends the stream, which reopens without Last-Event-ID"
    and the epoch-move tests of cmd/bronzewardctl imports_test and publish_test

- id: EVT-05
  setup: >-
    EVT-02's operation; serve is restarted, so a controller of the new epoch takes it over and it is
    unresolved
  action: operation watch op_... --timeout 5m, then Ctrl-C (SIGINT) once the stream is opened again
  exchange:
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, no Last-Event-ID; the stream stays open"
    - "POST /api/v1/recovery/entries as h-recovery on a second bronzeward serve, a recovery start over the same database, by the test: 201"
    - >-
      the second serve stopped and a third, a normal start, started; its controller takes the
      operation over and writes the stream's next event, of the entry's epoch
    - GET /api/v1/operations/op_..., after the stream ends
    - "GET /api/v1/operations/op_.../events, Accept: text/event-stream, no Last-Event-ID"
  fault: none
  expect:
    client: >-
      ends the stream at the first event ID of another epoch, reads the operation, clears what it
      showed, says why on standard error and opens the stream again without Last-Event-ID; on
      Ctrl-C stops watching, in one of two forms by whether the watch returns within the grace time
      (3 s) after Ctrl-C, which on a quiet stream needs an event or a keep-alive to land in it
    server: the operation still unresolved after Ctrl-C
    shown: >-
      the events, the clear line, the events again with the new one; then, exit 130, either
      "Stopped watching at your request. Operation op_... is still unresolved, as the server last
      read it; it goes on." (the watch returned within the grace; cmd/bronzewardctl
      TestOperationWatchInterruptReturns pins this form) or "Stopped watching at your request.
      Operation op_... goes on; the state it has now was not read." (it did not;
      TestOperationWatchInterrupt pins this form). This case asserts what both share: the prefix,
      "goes on", the follow line and the unchanged state, and proves the row, not the form. An
      operation that ends within the grace time is not stopped: the watch prints its outcome and exits
      0 or 4 (cmd/bronzewardctl TestOperationWatchInterruptTerminal pins this)
    absent: [tokens and the stand-in's secrets in stdout, stderr, argv]
  unit: an event ID of another epoch is internal/client TestWatch's case
