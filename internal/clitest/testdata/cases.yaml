# Shared conformance case records (docs/spec/client-contracts.md §12) that bronzewardctl runs.
# cli_test.go TestSharedCases runs exactly the cases recorded here without a test member, in this
# order, against a disposable bronzeward serve behind an in-process TLS injector. A record with a
# test member names the test that runs it instead, as its subtest named by the ID; that test
# refuses to run when its records differ from its subtests, and a test member naming no such test
# fails every test that reads this file. Data is synthetic: a viewer automation
# token issued by bronzeward token for the test database, and the fixture issuer's or the test
# identity provider's synthetic subjects. An exchange item is one string, with its headers after
# the request line.

- id: TLS-01
  setup: server behind the injector, whose certificate is from a test CA outside the system store; viewer automation token
  action: context add untrusted --server <injector URL>; then context add trusted with --certificate-authority <the test CA bundle>
  exchange:
    - first: none; the handshake fails before any request
    - second: GET /livez, no Authorization
  fault: certificate from an untrusted CA
  expect:
    client: refuses before sending; names the host, the certificate's subject and issuer and the trust source
    server: the injector receives no request for the first; the second is answered 204
    shown: '"is not trusted by the system trust store ... nothing was sent", exit 1; then "added", exit 0'
    absent: [token in stdout, stderr, argv]

- id: TLS-02
  setup: context trusted from TLS-01; a second server as the redirect target, counting requests
  action: whoami
  exchange:
    - "GET /api/v1/server, headers: Authorization, Accept: application/json"
    - "GET /api/v1/identity, headers: Authorization, Accept: application/json"
  fault: the injector answers GET /api/v1/identity with 307 to the target's origin
  expect:
    client: does not follow; sends nothing to the target; does not resend
    server: the injector sees the identity read once; the target sees no request
    shown: the 307 and its target, "follows no redirect"; exit 1
    absent: [token in stdout, stderr, argv]

- id: COMP-01
  setup: context trusted
  action: whoami
  exchange:
    - GET /api/v1/server
  fault: the injector rewrites the GET /server answer's apiRevision to 1
  expect:
    client: refuses after GET /server; sends no other request
    server: answers GET /server only
    shown: '"serves API revision 1; this bronzewardctl needs revision 2 or later"; exit 1'
    absent: [token in stdout, stderr, argv]

- id: COMP-02
  setup: context trusted
  action: whoami; then machine list --limit 1 --all
  exchange:
    - GET /api/v1/server
    - GET /api/v1/identity
    - GET /api/v1/machines?limit=1, one read per page
  fault: 'the injector adds "Deprecation: @1798761600" to every answer'
  expect:
    client: warns once per route, its method and path without the query
    server: answers every read
    shown: '"GET /api/v1/identity is deprecated (Deprecation: @1798761600)" exactly once; identity shown; "GET /api/v1/machines is deprecated" exactly once over the pages; exit 0'
    absent: [token in stdout, stderr, argv]

- id: PAGE-01
  setup: context trusted; a cluster with three machines, recorded by the fixture human before the cases
  action: machine list --limit 1; then machine list --limit 1 --all -o json
  exchange:
    - GET /api/v1/server
    - GET /api/v1/machines?limit=1
    - GET /api/v1/machines?limit=1&cursor=<next>, once per further page
  fault: none
  expect:
    client: one page names the next cursor; --all follows every page
    server: one page read per machine
    shown: '"Next page: --cursor"; then {"items": [...]} with every machine once, in the unpaged list''s order; exit 0'
    absent: [token in stdout, stderr, argv]

- id: PAGE-02
  setup: context trusted; the PAGE-01 machines
  action: machine list --limit 1 --all -o json, twice; machine list --limit 1 --cursor BWSYNTH-stale; machine list --limit 1 --all -o json
  exchange:
    - GET /api/v1/machines?limit=1
    - GET /api/v1/machines?limit=1&cursor=<next>
    - GET /api/v1/machines?limit=1, the restart
  fault: 'the injector answers the first cursor read 400 cursor-invalid: the first time in the same epoch; the second time with a new Bronzeward-Epoch on it and every later answer, as after a recovery entry; the server refuses the stale cursor itself; the last time with a new epoch and GET /server then rewritten to apiRevision 1'
  expect:
    client: discards the cursor and restarts the list, a given cursor included; runs the epoch handling only when the epoch changed; a failed GET /server re-read fails the list instead
    server: answers every read but the refused ones
    shown: '"reading the list again from its start" the first three times; the epoch notice on each epoch change, never the first time; every machine once, in order, or the first page; exit 0; the last time "API revision 1", no restart, exit 1'
    absent: [token in stdout, stderr, argv]

- id: REC-01
  setup: context trusted; the PAGE-01 machines
  action: 'status; then machine show <machine>, twice; then (variants, run by recovery_test.go TestRecovery on a real server) machine freeze <machine>, and machine unfreeze <machine> on a recovery start and on a normal start of the same database; then the recovery acts (variants, same test): recovery takeover, resolve, scope-account, account, mark and release on a recovery start before the entry, and recovery mark and release of the pre-restore-unaccounted scope after the entry'
  exchange:
    - GET /api/v1/server
    - GET /api/v1/recovery
    - GET /api/v1/machines
    - GET /api/v1/operations?state=unresolved
    - GET /api/v1/machines/<machine>
    - POST /api/v1/machines/<machine>/freezes and /unfreezes (variants)
    - 'the recovery acts (variants): the read each act makes first, refused by the server; no POST'
  fault: 'status: the injector adds "Bronzeward-Recovery-Mode: true" and rewrites GET /recovery to recovery mode on with one ready scope; machine show: 409 recovery-mode-active, first with machine and scope members, then without. Variants: none; the server refuses the unfreeze itself, with no scope member on a recovery start and with the machine''s scope on a normal start after the entry. Recovery acts: none; the server refuses them itself, with no scope member before the entry, and a mark or release with the machine''s scope after it'
  expect:
    client: shows the recovery banner and the scopes; names the scope, or the process restriction when there is none; an unfreeze says why it is refused, and the scope's reason never follows the process''s refusal
    server: answers the status reads; the injector refuses the machine reads
    shown: '"RECOVERY MODE is on in trusted", "Scopes: 1: <machine> ready", exit 0; then "the scope of machine <machine> is pre-restore-unaccounted" and "the server was started for recovery", "A restriction of the process, not of one scope" and "record the recovery entry first, then restart the server without the flag to end it", exit 1; variants: the freeze answers "Frozen." and exit 0; the unfreeze on a recovery start shows "Why: a server started for recovery refuses every request but the recovery entry" and "Next: if the recovery entry is not recorded yet, record it with recovery enter", on a normal start "Why: a restore can erase the record of a request" and "Next: recovery status names the next step of each scope", exit 1 each, no act, the machine still frozen; each recovery act before the entry shows "Recovery mode: the server was started for recovery:" and "A restriction of the process, not of one scope", never a scope, exit 1; a mark or release after the entry shows "Recovery mode: the scope of machine <machine> is pre-restore-unaccounted." and "Next: account the scope first: recovery scope-account", never the process''s restriction, exit 1; no act recorded'
    absent: [token in stdout, stderr, argv]

- id: AUTH-02
  setup: 'context human: oidc, issuer the fixture issuer, audience bronzeward, a D2 (b) token file holding no refresh token; a first whoami with a valid h-viewer token keeps the server''s maxTokenLifetimeSeconds'
  action: whoami, once per fixture defect expired, wrong-issuer, wrong-audience, over-lifetime, alg-none, groups-not-array, id-token-nonce, id-token-at-hash, no-jti
  exchange:
    - "GET /api/v1/server, headers: Authorization, Accept: application/json"
  fault: the token file holds an h-viewer token carrying the defect
  expect:
    client: no renewal without a refresh token; adds its own reading, labelled as such
    server: answers 401 unauthenticated with no reason
    shown: '"bronzewardctl''s own reading of the token, not the server''s reason:" then "Your sign-in expired", "The token is from <iss>/other; this context expects <iss>", "not issued for bronzeward", "lives longer than this server accepts", "Not accepted by human" for alg-none and groups-not-array, or "The identity provider sent an ID token, or an access token without jti" for id-token-nonce, id-token-at-hash and no-jti; exit 1'
    absent: [token in stdout, stderr, argv]

- id: AUTH-03
  setup: context human
  action: whoami
  exchange:
    - GET /api/v1/server
  fault: the token file holds an h-viewer token without the bw-viewers group
  expect:
    client: names the roles and the signed-in subject
    server: answers 403 forbidden with the route's roles
    shown: '"Needs one of the roles [viewer ...]. You are signed in as h-viewer."; exit 1'
    absent: [token in stdout, stderr, argv]

- id: AUTH-05
  setup: context human; h-recovery recorded the identity revocation of h-author before the cases
  action: whoami, twice
  exchange:
    - GET /api/v1/server, the first time only
  fault: the token file holds an h-author token
  expect:
    client: clears the token file; tries no new sign-in; the second run sends nothing
    server: answers 403 identity-revoked
    shown: '"contact a recovery administrator. The stored sign-in was cleared", exit 1; then "not signed in", exit 1'
    absent: [token in stdout, stderr, argv]

- id: AUTH-07
  setup: context human; the fixture provider answers the refresh grant with a token for h-other
  action: whoami
  exchange:
    - POST <token_endpoint>, grant_type=refresh_token, once
    - GET /api/v1/server
    - GET /api/v1/identity
  fault: the token file holds an h-viewer token 30 seconds from expiry; the renewed token's subject differs
  expect:
    client: renews once; shows the renewal on stderr as a new sign-in for another subject, and the result on stdout. The renewal goes to the provider, so the test counts it there and checks the injector's reads apart. This is the sign-in half; the pending write set aside is the write-cases.yaml record "AUTH-07 set-aside", which write_test.go TestWriteCases runs
    server: answers the reads for h-other
    shown: '"a new sign-in: the renewed token is for h-other at <issuer>, not h-viewer at <issuer>", then "subject h-other"; exit 0'
    absent: [token in stdout, stderr, argv]

- id: AUTH-10
  setup: context human; the server's deniedSubjects lists h-denied at the fixture issuer
  action: whoami, twice
  exchange:
    - GET /api/v1/server, the first time only
  fault: the token file holds a viewer token for h-denied
  expect:
    client: as AUTH-05
    server: answers 403 identity-revoked
    shown: as AUTH-05
    absent: [token in stdout, stderr, argv]

- id: AUTH-01
  test: TestLoginIdentityProvider
  setup: 'context idp: oidc, issuer the test identity provider (mise run dev-idp), audience its project, a D2 (b) token file; a disposable server trusting that provider; run by mise run go-idp'
  action: login, the provider's page driven headlessly as h-viewer; then whoami; machine list; context list -o json
  exchange:
    - GET <authorization_endpoint>, response_type=code, code_challenge_method=S256, state, nonce, a loopback redirect_uri
    - POST <token_endpoint>, grant_type=authorization_code with the PKCE verifier
    - "GET /api/v1/server, headers: Authorization, Accept: application/json"
    - GET /api/v1/machines
  fault: none
  expect:
    client: stores the sign-in in the token file; sends the reads with the access token; records the server's Bronzeward-Epoch on the context. The provider enforces PKCE and the loopback redirect; the test does not read the authorization request, so it does not check the state or the nonce
    server: answers every read for h-viewer as viewer
    shown: '"Signed in to idp", "as <subject> at <issuer>", "kept in the token file <file>"; whoami "viewer"; the list; lastEpoch in the context list; exit 0 each'
    absent: [token in stdout, stderr, argv]

- id: AUTH-06
  test: TestLoginIdentityProvider
  setup: context idp signed in by AUTH-01, its access token living 5 minutes; skipped under go test -short
  action: wait past the access token's expiry; operation list; then operation list again
  exchange:
    - POST <token_endpoint>, grant_type=refresh_token, once
    - GET /api/v1/operations, each time
  fault: none; the access token expired
  expect:
    client: renews with the refresh token and stores the new pair; the second read uses the live token and does not renew. The test checks the rotation at the provider, not the count of renewals inside the first read, nor the 5-minute lifetime, which the provider's configuration sets. This is the renewal half; the stream half with Last-Event-ID needs operation watch
    server: answers both reads
    shown: the operation list, exit 0 each time
    absent: [token in stdout, stderr, argv, and the provider redeeming the rotated-out refresh token]

- id: AUTH-09
  test: TestLoginIdentityProvider
  setup: context idp signed in by the test's earlier steps
  action: logout
  exchange:
    - POST <revocation_endpoint>, the refresh token
  fault: none
  expect:
    client: removes the token file; revokes the refresh token at the provider; states that the access token stays valid at the server until it expires. This is the token-file half; the credential-store half runs against the fixture provider in login_test.go TestLogin "system credential store", which skips without dbus-daemon, dbus-send and gnome-keyring-daemon (ginsys/bronzeward#386)
    server: still accepts the access token on GET /api/v1/identity after the logout; the test does not check the time stated
    shown: '"the token file <file> is removed", "The refresh token is revoked at the identity provider.", "stays valid at the server until"; exit 0'
    absent: [token in stdout, stderr, argv, the token file, and the provider redeeming the revoked refresh token]
