name: Release / Publish

# Called by Release / Create only (ginsys/bronzeward#262 P1, P3, P4, P7); it has no trigger of its
# own. It builds the archives of the tagged commit exactly as CI's package job does (mise run
# package, with BW_VERSION the tag), checks that every binary reports the tag and the commit and
# that the bundle's footer names the tag (scripts/release/check-build.sh), writes an SPDX SBOM per
# archive, signs SHA256SUMS keyless with this workflow's GitHub OIDC identity (Sigstore, recorded in
# the public Rekor log), attests each archive, and publishes a pre-release that is never Latest.
# It refuses a version that already has a release, and, as Create does, a repository without a
# LICENSE (ginsys/bronzeward#16). A dry run, the default, builds and checks and keeps the files as
# a workflow artifact: it signs, attests and publishes nothing.

on:
  workflow_call:
    inputs:
      version:
        description: "The tag to publish"
        required: true
        type: string
      commit:
        description: "The commit the tag names; Create's own"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and check, publish nothing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  # As in ci.yml: tools come from jdx/mise-action's install step only.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BW_VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # First, and in this job, so every attempt that could publish makes it: a re-run of a
      # failed publication finds the release it left and stops.
      - name: Refuse a version that already has a release
        run: |
          rc=0
          err=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BW_VERSION" 2>&1 >/dev/null) || rc=$?
          case "$rc:$err" in
            *"(HTTP 404)"*) echo "No release exists for $BW_VERSION." ;;
            0:*) echo "::error::$BW_VERSION already has a release; nothing is published over it."; exit 1 ;;
            *) echo "::error::could not read whether $BW_VERSION has a release: $err"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Check the tag, changelog and licence
        run: |
          if [ "$DRY_RUN" = 0 ]; then
            tagged=$(git ls-remote --tags origin "refs/tags/$BW_VERSION" | cut -f1)
            if [ "$tagged" != "$COMMIT" ]; then
              echo "::error::the tag $BW_VERSION names '${tagged:-nothing}', not $COMMIT."
              exit 1
            fi
          fi
          scripts/release/guard.sh "$BW_VERSION" "$RUNNER_TEMP/release-notes.md"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
          install_args: go node goreleaser
      - run: mise run package
      - name: Check the binaries and the bundle name the tag and the commit
        run: EXPECT_REVISION="$COMMIT" scripts/release/check-build.sh dist

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0
      - name: Write an SPDX SBOM per archive
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        # A binary's SBOM lists the modules of its build information. The web bundle carries no
        # package metadata, so its SBOM lists the lockfile's production packages; the bundlers'
        # injected helpers are in its notices only.
        run: |
          for a in dist/*.tar.gz; do
            src=file:$a
            case $a in dist/bronzeward-web_*) src=file:web/package-lock.json ;; esac
            "$SYFT" scan "$src" -o "spdx-json=$a.spdx.json"
          done

      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
          retention-days: 14

      # cosign-installer's own default release, which the action verifies by checksum.
      - if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        if: ${{ !inputs.dry_run }}
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest each archive
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the pre-release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "$BW_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "$BW_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
