name: Probe 1028

# A throwaway probe (ginsys/bronzeward#1028), never a pull request: the Safari styling and signed-out specs
# run many times on a hosted macOS runner, to count how often a find fails with a stale element.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: wdio runs of the two specs in each job
        default: "30"
      instrument:
        description: "1 reads the document's time origin around the navigation in the styling hook"
        default: "0"

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BW_BROWSERS: safari
      MISE_DISABLE_TOOLS: node
      BW_PROBE_1028: ${{ inputs.instrument }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: node
        run: |
          v=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache_save: false
          install_args: go
      - run: sudo safaridriver --enable
      - run: defaults write -g NSAutomaticInlinePredictionEnabled -bool false
      - env:
          MISE_EXEC_AUTO_INSTALL: "false"
        run: mise run web
      - run: go build -o bin/webhost ./fixtures/webhost
      - name: Repeat the two specs
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          RUNS: ${{ inputs.runs }}
        run: |
          cd web
          export BW_WDIO_CACHE=${TMPDIR:-/tmp}
          ok=0; bad=0; stale=0
          mkdir -p ../probe-out
          for i in $(seq 1 "$RUNS"); do
            tmp=$(bash ../scripts/ci/browser-tmp.sh start browser)
            if TMPDIR=$tmp BW_WEB_CANARY=BWSYNTH-probe mise exec -- npx wdio run e2e/wdio.conf.ts --spec e2e/signed-out.e2e.ts --spec e2e/styling.e2e.ts > "../probe-out/run-$i.log" 2>&1; then
              ok=$((ok+1))
            else
              bad=$((bad+1))
            fi
            n=$(grep -c 'Stale element found' "../probe-out/run-$i.log" || true)
            [ "$n" -eq 0 ] || stale=$((stale+1))
            rm -rf "$tmp" e2e/out
          done
          echo "shard ${{ matrix.shard }}: runs=$RUNS passed=$ok failed=$bad runs_with_stale_element=$stale" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -h 'probe1028' ../probe-out/run-*.log | sed 's/.*probe1028/probe1028/' > ../probe-out/origin.txt || true
          echo "origin lines: $(wc -l < ../probe-out/origin.txt) replaced: $(grep -c 'replaced=true' ../probe-out/origin.txt || true)" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.shard }}
          path: probe-out
          retention-days: 7
