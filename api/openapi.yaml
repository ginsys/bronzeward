        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ExpectedEpoch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeReleaseRequest'}
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Location: {$ref: '#/components/headers/Location'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopeReleaseBody'}
        default: {$ref: '#/components/responses/Problem'}
  /releases:
    get:
      operationId: getReleases
      tags: [releases]
      x-bronzeward-roles: [viewer, author, publisher, approver, recovery-admin]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ReleaseBody'}
                  next: {type: string, description: The cursor of the next page; absent on the last.}
                additionalProperties: false
        default: {$ref: '#/components/responses/Problem'}
  /releases/{id}:
    get:
      operationId: getReleasesId
      tags: [releases]
      x-bronzeward-roles: [viewer, author, publisher, approver, recovery-admin]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseBody'}
        default: {$ref: '#/components/responses/Problem'}
  /releases/{id}/machines/{m}/review:
    get:
      operationId: getReleasesIdMachinesMReview
      tags: [releases]
      x-bronzeward-roles: [viewer, author, publisher, approver, recovery-admin]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: m
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewBody'}
        default: {$ref: '#/components/responses/Problem'}
  /server:
    get:
      operationId: getServer
      tags: [server]
      description: What the process that answered serves and the read-only settings a client shows (persistence and API §9.1,
        §9.2). It takes no query. Before a recovery start's entry commits it is refused as every request but the entry is.
      x-bronzeward-roles: [viewer, author, publisher, approver, recovery-admin]
      parameters: []
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerBody'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A human's OIDC token from the configured issuer, or an automation token `bwt_<id>.<secret>`, which is opaque,
        not a JWT (persistence and API §10.1, §10.2).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 16 to 128 characters of [A-Za-z0-9_-] (persistence and API §7.1).
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]{16,128}$'}
    ExpectedEpoch:
      name: Bronzeward-Expected-Epoch
      in: header
      description: Optional; the epoch identity the client expects. When the key has no record and this names another
        epoch, the request is refused 412 epoch-mismatch and its own transaction commits nothing. An empty one or two
        of them are 400 invalid-request (API revision 2; persistence and API §7.2, §9.1).
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag last read (persistence and API §4.1).
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: 1 to 500; 50 when absent.
      schema: {type: integer, minimum: 1, maximum: 500}
    Cursor:
      name: cursor
      in: query
      description: The next member of the previous page, opaque, valid in the epoch that issued it.
      schema: {type: string}
    LastEventID:
      name: Last-Event-ID
      in: header
      description: '`<epoch>:<number>`: resume a stream after that event (persistence and API §8.3).'
      schema: {type: string}
  headers:
    Epoch:
      description: The recovery epoch the request was answered in (persistence and API §9.1).
      required: true
      schema: {type: string}
    OptionalEpoch:
      description: The recovery epoch the request was answered in (persistence and API §9.1); absent from a 401, a 403
        identity-revoked and an answer refused before the epoch was read.
      schema: {type: string}
    RecoveryMode:
      description: true while the server runs in recovery mode (persistence and API §9.1); absent otherwise, and from
        every answer Bronzeward-Epoch is absent from.
      schema: {type: string, enum: ['true']}
    ETag:
      description: The resource's version (persistence and API §4.1).
      required: true
      schema: {type: string}
    OptionalETag:
      description: The resource's version (persistence and API §4.1), when the answer is one versioned resource.
      schema: {type: string}
    Location:
      description: 'The resource the answer names: the one it created, or the existing resource the act was recorded on, such
        as the machine for a freeze or a scope mark, /recovery for a recovery entry or exit, or an operation already queued
        for a publication.'
      required: true
      schema: {type: string}
    OptionalLocation:
      description: The resource the answer names, when it names one; see Location.
      schema: {type: string}
    IdempotentReplayed:
      description: true when the answer is a stored one, replayed for a repeated key (persistence and API §7.2).
      schema: {type: string, enum: ['true']}
    NoStore:
      description: 'no-store: the answer must not be cached. Every answer of the API carries it, problems included (persistence
        and API §9.1).'
      required: true
      schema: {type: string, enum: [no-store]}
    RequestID:
      description: The request's identifier, on every answer of the API, problems included (persistence and API §9.1). A problem
        the request answers names it as its instance; a replayed answer carries the identifier of the request that replays it.
      required: true
      schema: {type: string}
  responses:
    Problem:
      description: A problem document (persistence and API §9.4).
      headers:
        Bronzeward-Epoch: {$ref: '#/components/headers/OptionalEpoch'}
        Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
        Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
        WWW-Authenticate:
          description: 'On 401: the bearer challenge (RFC 6750).'
          schema: {type: string}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, instance]
      properties:
        type:
          type: string
          enum:
          - urn:bronzeward:problem:invalid-request
          - urn:bronzeward:problem:cursor-invalid
          - urn:bronzeward:problem:unauthenticated
          - urn:bronzeward:problem:forbidden
          - urn:bronzeward:problem:identity-revoked
          - urn:bronzeward:problem:not-found
          - urn:bronzeward:problem:conflict
          - urn:bronzeward:problem:stale-input
          - urn:bronzeward:problem:recovery-mode-active
          - urn:bronzeward:problem:scope-busy
          - urn:bronzeward:problem:ingestion-abandoned
          - urn:bronzeward:problem:recovery-mode-entered
          - urn:bronzeward:problem:idempotency-key-reused
          - urn:bronzeward:problem:idempotency-key-required
          - urn:bronzeward:problem:precondition-required
          - urn:bronzeward:problem:precondition-failed
          - urn:bronzeward:problem:epoch-mismatch
          - urn:bronzeward:problem:validation-failed
          - urn:bronzeward:problem:epoch-superseded
          - urn:bronzeward:problem:internal-error
          - urn:bronzeward:problem:not-implemented
          - urn:bronzeward:problem:transient-conflict
          - urn:bronzeward:problem:dependency-unavailable
          - urn:bronzeward:problem:machine-identity-mismatch
          - urn:bronzeward:problem:talos-access-unavailable
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        detail: {type: string}
      additionalProperties: true
      description: RFC 9457. Extension members depend on the problem type.
    Role:
      type: string
      enum: [viewer, author, publisher, approver, recovery-admin]
    AbandonInput: {type: object, additionalProperties: false}
    AccessVersionBody:
      type: object
      required: [path, version, created]
      properties:
        path: {type: string}
        version: {type: integer}
        created: {type: string}
      additionalProperties: false
    AccountingBody:
      type: object
      required:
      - operation
      - attempt
      - revision
      - decidedBy
      - role
      - start
      - end
      - act
      - epoch
      - at
      properties:
        operation: {type: string}
        attempt: {type: string}
        revision: {type: integer}
        decidedBy: {type: string}
        role: {type: string}
        start: {type: string}
        end: {type: string}
        act: {type: string}
        epoch: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    AccountingRequest:
      type: object
      required: [start, end]
      properties:
        start: {type: string}
        end: {type: string}
        facts:
          type: [object, 'null']
          additionalProperties: {type: string}
          description: At most 16 members; names at most 64 bytes, values at most 1024.
      additionalProperties: false
    ActItem:
      type: object
      required:
      - id
      - principal
      - principalKind
      - via
      - role
      - action
      - subjects
      - idempotencyKey
      - requestId
      - epoch
      - at
      properties:
        id: {type: string}
        principal: {type: string}
        principalKind: {type: string}
        via: {type: string}
        role: {type: [string, 'null']}
        action: {type: string}
        subjects:
          type: array
          items: {type: string}
        idempotencyKey: {type: [string, 'null']}
        requestId: {type: [string, 'null']}
        epoch: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    AdoptResult:
      type: object
      description: 'An adopt operation''s result: the adoption record, named by its plan (adoption.go).'
      required: [adoptionRecord]
      properties:
        adoptionRecord: {type: string}
      additionalProperties: false
    AlertBody:
      type: object
      required:
      - id
      - kind
      - dependency
      - provider
      - object
      - version
      - created
      - class
      - reason
      - releases
      - deletion
      - observedFrom
      - answerDate
      - epoch
      - recordedAt
      properties:
        id: {type: string}
        kind: {type: string}
        dependency: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        object: {type: [string, 'null']}
        version: {type: [integer, 'null']}
        created: {type: [string, 'null']}
        class: {type: [string, 'null']}
        reason: {type: [string, 'null']}
        releases:
          type: [array, 'null']
          items: {type: string}
        deletion: {type: [string, 'null'], format: date-time}
        observedFrom: {type: [string, 'null'], format: date-time}
        answerDate: {type: [string, 'null'], format: date-time}
        epoch: {type: string}
        recordedAt: {type: string, format: date-time}
      additionalProperties: false
    Applied:
      type: object
      required: [release, source]
      properties:
        release: {type: string}
        source: {type: string}
      additionalProperties: false
    ApplyFailed:
      type: object
      description: An apply-config operation's error once a completion observation contradicted its postconditions (settle.go).
      required: [outcome, cause, observation, attempts]
      properties:
        outcome: {const: failed}
        cause: {type: string}
        observation: {type: string}
        attempts: {type: integer}
      additionalProperties: false
    ApplyRejected:
      type: object
      description: An apply-config operation's error once the node refused every attempt as invalid (outcome.go).
      required: [outcome, cause, attempts]
      properties:
        outcome: {const: rejected}
        cause: {type: string}
        attempts: {type: integer}
      additionalProperties: false
    ApplyResult:
      type: object
      description: 'An apply-config operation''s result once it completed (settle.go complete): the applied release and the
        confirming observation.'
      required: [appliedRelease, observation]
      properties:
        appliedRelease: {type: string}
        observation: {type: string}
      additionalProperties: false
    ApprovalBody:
      type: object
      required: [id, plan, approver, epoch, selfApproval, unseenOverwrite]
      properties:
        id: {type: string}
        plan: {type: string}
        approver: {$ref: '#/components/schemas/ApprovalBy'}
        epoch: {type: string}
        selfApproval: {$ref: '#/components/schemas/SelfApproval'}
        unseenOverwrite: {type: boolean}
      additionalProperties: false
    ApprovalBy:
      type: object
      required: [principal, role]
      properties:
        principal: {type: string}
        role: {type: string}
      additionalProperties: false
    ApprovalInput: {type: object, additionalProperties: false}
    ApprovalRevocationBody:
      type: object
      required: [approval, plan, machine, revokedBy, role, reason, act, epoch, at]
      properties:
        approval: {type: string}
        plan: {type: string}
        machine: {type: string}
        revokedBy: {type: string}
        role: {type: string}
        reason: {type: string}
        act: {type: string}
        epoch: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    AssignmentBody:
      type: object
      required: [id, cluster, machine, revision, headRevision, createdAt]
      properties:
        id: {type: string}
        cluster: {type: string}
        machine: {type: string}
        revision: {type: [string, 'null']}
        headRevision: {type: integer}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    AssignmentInput:
      description: Profiles, then fragments per layer by name; 1 to 256 selected in all. A fragments member is a layer and
        lists at least one fragment.
      type: object
      required: []
      properties:
        profiles:
          type: [array, 'null']
          items: {type: string}
        fragments:
          type: [object, 'null']
          properties:
            global: {$ref: '#/components/schemas/LayerFragments'}
            site: {$ref: '#/components/schemas/LayerFragments'}
            cluster: {$ref: '#/components/schemas/LayerFragments'}
            role: {$ref: '#/components/schemas/LayerFragments'}
            workload: {$ref: '#/components/schemas/LayerFragments'}
            override: {$ref: '#/components/schemas/LayerFragments'}
          additionalProperties: false
      additionalProperties: false
    LayerFragments:
      description: The fragments one layer selects, by name.
      type: array
      minItems: 1
      items: {type: string}
    AssignmentRevisionBody:
      type: object
      required: [id, cluster, machine, profiles, fragments, author, createdAt]
      properties:
        id: {type: string}
        cluster: {type: string}
        machine: {type: string}
        profiles:
          type: array
          items: {type: string}
        fragments:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        author: {type: string}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    AttemptAccounting:
      type: object
      required: [basis, at, revision]
      properties:
        basis: {type: string}
        at: {type: string, format: date-time}
        revision: {type: integer}
      additionalProperties: false
    AttemptBody:
      type: object
      required:
      - id
      - number
      - controller
      - generation
      - route
      - observation
      - transportDeadline
      - verificationDeadline
      - at
      - revision
      - classification
      - response
      - accounting
      properties:
        id: {type: string}
        number: {type: integer}
        controller: {type: string}
        generation: {type: integer}
        route: {type: string}
        observation: {type: string}
        transportDeadline: {type: string, format: date-time}
        verificationDeadline: {type: string, format: date-time}
        at: {type: string, format: date-time}
        revision: {type: integer}
        classification: {type: [integer, 'null']}
        response:
          oneOf:
          - {$ref: '#/components/schemas/AttemptResponse'}
          - {type: 'null'}
        accounting:
          oneOf:
          - {$ref: '#/components/schemas/AttemptAccounting'}
          - {type: 'null'}
      additionalProperties: false
    AttemptResponse:
      type: object
      required: [class, code, at, revision]
      properties:
        class: {type: string}
        code: {type: integer}
        at: {type: string, format: date-time}
        revision: {type: integer}
      additionalProperties: false
    CancellationBody:
      type: object
      required: [plan, machine, cancelledBy, role, reason, act, epoch, at]
      properties:
        plan: {type: string}
        machine: {type: string}
        cancelledBy: {type: string}
        role: {type: string}
        reason: {type: string}
        act: {type: string}
        epoch: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    ClusterBody:
      type: object
      required: [id, name, endpoint, contract, talosClusterId]
      properties:
        id: {type: string}
        name: {type: string}
        endpoint: {type: string}
        contract: {type: string}
        talosClusterId: {type: string}
      additionalProperties: false
    ClusterInput:
      type: object
      required: [name, endpoint, contract, talosClusterId]
      properties:
        name:
          type: string
          minLength: 1
          description: At most 128 bytes, no control characters.
        endpoint:
          type: string
          description: https://<host>[:<port>], with no path, query, fragment or user information.
        contract: {type: string, description: 'A Talos contract minor, as v1.13.'}
        talosClusterId:
          type: string
          description: 'The cluster ID `talosctl get info` prints: 32 bytes in URL-safe base64.'
      additionalProperties: false
    ContinuationInput: {type: object, additionalProperties: false}
    CreatedBy:
      type: object
      required: [principal, role]
      properties:
        principal: {type: string}
        role: {type: string}
      additionalProperties: false
    Declarations:
      type: object
      required: []
      properties:
        references:
          type: [object, 'null']
          additionalProperties: {$ref: '#/components/schemas/ReferenceInput'}
        embedded:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Embedded'}
      additionalProperties: false
    DependencyBody:
      type: object
      required:
      - id
      - provider
      - object
      - version
      - created
      - class
      - reason
      - firstRetainedAt
      - unknownSince
      - observedFrom
      - recordedAt
      - stale
      properties:
        id: {type: string}
        provider: {type: string}
        object: {type: string}
        version: {type: integer}
        created: {type: string}
        class: {type: string}
        reason: {type: [string, 'null']}
        firstRetainedAt: {type: [string, 'null'], format: date-time}
        unknownSince: {type: [string, 'null'], format: date-time}
        observedFrom: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        stale: {type: boolean}
      additionalProperties: false
    DependencyPage:
      type: object
      required: [items, lastPass]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DependencyBody'}
        next: {type: string}
        lastPass: {type: [string, 'null'], format: date-time}
      additionalProperties: false
    DependencyRecordBody:
      type: object
      required: [machine, kind]
      properties:
        machine: {type: string}
        kind: {type: string}
      additionalProperties: false
    DependencyReleaseBody:
      type: object
      required: [release, cluster, publishedAt, records]
      properties:
        release: {type: string}
        cluster: {type: string}
        publishedAt: {type: string, format: date-time}
        records:
          type: array
          items: {$ref: '#/components/schemas/DependencyRecordBody'}
      additionalProperties: false
    DiscardInput: {type: object, additionalProperties: false}
    DraftBody:
      type: object
      required: [id, cluster, title, state, revision, entries]
      properties:
        id: {type: string}
        cluster: {type: string}
        title: {type: string}
        state: {type: string}
        revision: {type: integer}
        entries:
          type: array
          items:
            oneOf:
            - {$ref: '#/components/schemas/DraftEntry'}
            - {$ref: '#/components/schemas/SourceEntry'}
      additionalProperties: false
    DraftEntry:
      type: object
      required: [kind, machine, revision]
      properties:
        kind: {const: import-base}
        machine: {type: string}
        revision: {type: string}
      additionalProperties: false
    DraftInput:
      type: object
      required: [cluster, title]
      properties:
        cluster: {type: string}
        title: {type: string, minLength: 1, description: At most 256 bytes.}
      additionalProperties: false
    Embedded:
      type: object
      required: [path, format]
      properties:
        path: {type: string}
        format: {type: string, enum: [yaml, json]}
      additionalProperties: false
    EndpointChangeBody:
      type: object
      required:
      - machine
      - revision
      - previousEndpoint
      - talosEndpoint
      - changedBy
      - role
      - act
      - epoch
      - at
      properties:
        machine: {type: string}
        revision: {type: integer}
        previousEndpoint: {type: string}
        talosEndpoint: {type: string}
        changedBy: {type: string}
        role: {type: string}
        act: {type: string}
        epoch: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    EndpointInput:
      type: object
      required: [talosEndpoint]
      properties:
        talosEndpoint: {type: string}
      additionalProperties: false
    EntryBody:
      type: object
      required:
      - epoch
      - previousEpoch
      - enteredBy
      - role
      - reason
      - restored
      - stoppedAt
      - machines
      - operations
      - act
      - at
      properties:
        epoch: {type: string}
        previousEpoch: {type: string}
        enteredBy: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        reason: {type: string}
        restored:
          type: array
          items: {$ref: '#/components/schemas/RestoredBackup'}
        stoppedAt: {type: string, format: date-time}
        machines: {type: integer}
        operations:
          type: array
          items: {type: string}
        act: {type: string}
        at: {type: string, format: date-time}
      additionalProperties: false
    EntryRequest:
      type: object
      required: [restored, stoppedAt, reason]
      properties:
