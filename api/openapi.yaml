  /operations/{id}/events:
    get:
      operationId: getOperationsIdEvents
      tags: [operations]
      x-bronzeward-roles: [viewer, author, publisher, approver, recovery-admin]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/LastEventID'}
      description: 'With `Accept: text/event-stream` the answer is Server-Sent Events and the request takes no query; otherwise
        it is a JSON page of EventBody items (persistence and API §8.3). Each SSE event has `id: <epoch>:<number>`, `event:
        <type>` and `data: <data>`: an EventBody''s id, type and data; its `at` is sent only in the JSON form. A Last-Event-ID
        of another epoch cannot be resumed: the server first sends `event: reset` with `data: {}`, then the events from the
        start. A plan operation''s types are the kinds of the machine timeline entries that name it, an apply-config operation''s
        beginning with its commitment, for example commitment, attempt, refusal, response, accounting, classification, ownership-transition,
        operation-state, adoption and applied-change; an adopt operation, created completed, has no commitment and begins
        with its adoption; a publish or ingest operation''s are its own events (queued, claimed, started, staged, paused,
        marked, mark-refused, continued, taken-over, resume-failed, talos-access, succeeded, failed). The stream ends when
        the operation is terminal and its events are written, or at the expiry of the token that opened it.'
      responses:
        '200':
          description: OK.
          headers:
            Bronzeward-Request-ID: {$ref: '#/components/headers/RequestID'}
            Bronzeward-Epoch: {$ref: '#/components/headers/Epoch'}
            Bronzeward-Recovery-Mode: {$ref: '#/components/headers/RecoveryMode'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/EventBody'}
                  next: {type: string, description: The cursor of the next page; absent on the last.}
                additionalProperties: false
            text/event-stream:
              schema: {type: string, description: Server-Sent Events.}
        default: {$ref: '#/components/responses/Problem'}
