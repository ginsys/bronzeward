openapi: 3.1.0
info:
  title: Bronzeward API
  version: v1
  description: 'The HTTP API of persistence and API §9, under /api/v1. Every operation carries the route table''s facts as
    extension fields: x-bronzeward-roles, the roles that may call it, in the table''s order, empty for GET /identity, which
    any authenticated credential may call; x-bronzeward-human-only, refused
    to automation principals; x-bronzeward-if-match, requires If-Match; x-bronzeward-normal-start-only, refused on a recovery
    start; x-bronzeward-recovery-start-only, served only by a process started with the recovery-start flag, any other answering
    409 conflict. internal/api/openapi_test.go fails when they, an operation''s path parameters, its Idempotency-Key and If-Match
    parameters or its request body differ from routes(), in either direction, and the API tests validate every answer''s status,
    headers and body on a described route, except an answer of the event-stream route (its tests bypass the check), and the
    body of every request the server accepted, against this description. Every error answer is a problem document (default
    response). Request bodies are decoded strictly: application/json; at the top level exactly the listed members, none repeated; in a nested object no unlisted
    or repeated member, though the decoder matches a nested member''s name without regard to case, so a client must send the
    names as listed; a member whose schema admits null may be given as null, which the decoder treats as absent. The idempotency
    fingerprint covers the canonical body (persistence and API §7.1), which keeps a null member, so a retry that adds or drops
    one is a different request.'
servers:
- {url: /api/v1}
security:
- {bearer: []}
paths:
